<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Owner Dashboard – Autonomous Business NFT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #050508;
      color: #f4f4f5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 440px; margin: 0 auto; padding: 16px 16px 80px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0 20px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .logo-box {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 9px; display: grid; place-items: center;
    }
    .back { color: #a1a1aa; text-decoration: none; font-size: 0.9rem; }
    .header { margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; }
    .header .sub { color: #a1a1aa; font-size: 0.9rem; }

    .wallet-bar {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .wallet-bar .addr { font-size: 0.85rem; color: #a1a1aa; }
    .btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white; border: none; border-radius: 12px;
      padding: 10px 16px; font-weight: 600; font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
    }
    .btn-sm { padding: 8px 12px; font-size: 0.8rem; border-radius: 10px; }

    .business-card {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .business-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #f4f4f5;
    }
    .business-card .desc {
      color: #a1a1aa;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    .token-id {
      font-size: 0.75rem;
      color: #71717a;
      margin-bottom: 12px;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      background: #18181b;
      border-radius: 12px;
      padding: 12px;
    }
    .stat .label { font-size: 0.75rem; color: #71717a; }
    .stat .value { font-size: 1.1rem; font-weight: 700; color: #4ade80; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    .status-badge::before {
      content: "";
      width: 6px; height: 6px;
      background: #4ade80;
      border-radius: 50%;
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .activity {
      background: #18181b;
      border-radius: 12px;
      padding: 14px;
      color: #a1a1aa;
      font-size: 0.9rem;
      text-align: center;
    }
    .empty { text-align: center; padding: 40px 20px; color: #71717a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">
        <div class="logo-box">🤖</div>
        <span>Business NFT</span>
      </div>
      <a href="./index.html" class="back">← Mint</a>
    </div>

    <div class="header">
      <h1>Owner Dashboard</h1>
      <div class="sub">Your Autonomous Businesses</div>
    </div>

    <div class="wallet-bar" id="walletBar" style="display:none;">
      <div>
        <div style="font-size:0.75rem;color:#71717a;">Connected</div>
        <div class="addr" id="accountDisplay">—</div>
      </div>
      <button class="btn btn-outline btn-sm" id="disconnectBtn">Disconnect</button>
    </div>

    <div id="connectSection">
      <button class="btn" id="connectBtn" style="width:100%;padding:14px;">Connect Wallet</button>
    </div>

    <div id="list" style="margin-top:20px;">
      <div class="activity">Connect wallet to see your businesses</div>
    </div>
  </div>

  <script type="module">
    import { setupWalletSelector } from "https://cdn.jsdelivr.net/npm/@near-wallet-selector/core@8.9.1/dist/esm/index.js";
    import { setupModal } from "https://cdn.jsdelivr.net/npm/@near-wallet-selector/modal-ui@8.9.1/dist/esm/index.js";
    import { setupMeteorWallet } from "https://cdn.jsdelivr.net/npm/@near-wallet-selector/meteor-wallet@8.9.1/dist/esm/index.js";
    import { setupHereWallet } from "https://cdn.jsdelivr.net/npm/@near-wallet-selector/here-wallet@8.9.1/dist/esm/index.js";
    import { setupMyNearWallet } from "https://cdn.jsdelivr.net/npm/@near-wallet-selector/my-near-wallet@8.9.1/dist/esm/index.js";

    const CONTRACT_ID = "buildingfromthetop.testnet";
    const NETWORK = "testnet";

    let selector = null;
    let modal = null;
    let accountId = null;

    async function init() {
      selector = await setupWalletSelector({
        network: NETWORK,
        modules: [
          setupMeteorWallet(),
          setupHereWallet(),
          setupMyNearWallet(),
        ],
      });

      modal = setupModal(selector, {
        contractId: CONTRACT_ID,
      });

      const state = selector.store.getState();
      if (state.accounts.length > 0) {
        accountId = state.accounts[0].accountId;
        updateUI();
        loadDashboard();
      }

      selector.subscribe((state) => {
        if (state.accounts.length > 0) {
          accountId = state.accounts[0].accountId;
        } else {
          accountId = null;
        }
        updateUI();
        if (accountId) loadDashboard();
      });
    }

    function updateUI() {
      const connectSection = document.getElementById("connectSection");
      const walletBar = document.getElementById("walletBar");
      const accountDisplay = document.getElementById("accountDisplay");

      if (accountId) {
        connectSection.style.display = "none";
        walletBar.style.display = "flex";
        accountDisplay.innerText = accountId;
      } else {
        connectSection.style.display = "block";
        walletBar.style.display = "none";
      }
    }

    document.getElementById("connectBtn").addEventListener("click", () => {
      modal.show();
    });

    document.getElementById("disconnectBtn").addEventListener("click", async () => {
      const wallet = await selector.wallet();
      await wallet.signOut();
      accountId = null;
      updateUI();
      document.getElementById("list").innerHTML = `<div class="activity">Connect wallet to see your businesses</div>`;
    });

    async function loadDashboard() {
      const listEl = document.getElementById("list");
      listEl.innerHTML = `<div class="activity">Loading your businesses...</div>`;

      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "1",
            method: "query",
            params: {
              request_type: "call_function",
              finality: "final",
              account_id: CONTRACT_ID,
              method_name: "nft_tokens_for_owner",
              args_base64: btoa(JSON.stringify({ account_id: accountId }))
            }
          })
        });

        const data = await res.json();
        const bytes = data.result?.result;
        if (!bytes) {
          listEl.innerHTML = `<div class="empty">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        const tokens = JSON.parse(String.fromCharCode(...bytes));
        if (!tokens || tokens.length === 0) {
          listEl.innerHTML = `<div class="empty">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        listEl.innerHTML = "";
        tokens.forEach(token => {
          const title = token.metadata?.title || "Untitled Business";
          const desc = token.metadata?.description || "No description";
          const businessAcc = token.business_account || `business-\( {token.token_id}. \){CONTRACT_ID}`;

          const card = document.createElement("div");
          card.className = "business-card";
          card.innerHTML = `
            <div class="status-badge">Agent Ready</div>
            <h3>${title}</h3>
            <div class="desc">${desc}</div>
            <div class="token-id">Token #${token.token_id} · ${businessAcc}</div>

            <div class="stats">
              <div class="stat">
                <div class="label">Treasury</div>
                <div class="value">0.00 Ⓝ</div>
              </div>
              <div class="stat">
                <div class="label">Jobs Done</div>
                <div class="value">0</div>
              </div>
            </div>

            <div class="actions">
              <button class="btn btn-sm activate-btn" data-token="\( {token.token_id}" data-account=" \){businessAcc}">
                Activate Business
              </button>
              <button class="btn btn-outline btn-sm" disabled>Claim Profits</button>
            </div>
          `;
          listEl.appendChild(card);
        });

        // Attach activate buttons
        document.querySelectorAll(".activate-btn").forEach(btn => {
          btn.addEventListener("click", async (e) => {
            const tokenId = e.target.dataset.token;
            const businessAccount = e.target.dataset.account;
            await activateBusiness(tokenId, businessAccount, e.target);
          });
        });

      } catch (err) {
        console.error(err);
        listEl.innerHTML = `<div class="activity">Failed to load businesses</div>`;
      }
    }

    async function activateBusiness(tokenId, businessAccount, btn) {
      try {
        btn.disabled = true;
        btn.innerText = "Confirm in wallet...";

        const wallet = await selector.wallet();

        // Create the real sub-account + fund it with 0.1 NEAR
        // Transaction is sent TO the new account itself
        await wallet.signAndSendTransaction({
          receiverId: businessAccount,
          actions: [
            {
              type: "CreateAccount"
            },
            {
              type: "Transfer",
              params: {
                deposit: "100000000000000000000000" // 0.1 NEAR
              }
            }
          ]
        });

        btn.innerText = "✅ Activated";
        btn.style.background = "#3f3f46";
        alert(`Business account ${businessAccount} created and funded with 0.1 NEAR!`);
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.innerText = "Activate Business";
        alert(err.message || "Transaction cancelled or failed");
      }
    }

    init();
  </script>
</body>
</html>
