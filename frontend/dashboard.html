<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Owner Dashboard – Autonomous Business NFT</title>
  <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl-fast.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@hot-labs/near-connect@0.1.9/dist/index.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #050508;
      color: #f4f4f5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 440px; margin: 0 auto; padding: 16px 16px 80px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0 20px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .logo-box {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 9px; display: grid; place-items: center;
    }
    .back { color: #a1a1aa; text-decoration: none; font-size: 0.9rem; }
    .header { margin-bottom: 20px; }
    .header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .header .sub { color: #a1a1aa; font-size: 0.9rem; }
    .connect-btn, .disconnect-btn {
      width: 100%; padding: 14px; border-radius: 14px;
      font-weight: 600; font-size: 1rem; cursor: pointer; margin-bottom: 16px;
    }
    .connect-btn {
      background: #22c55e; color: #000; border: none;
    }
    .disconnect-btn {
      background: transparent; border: 1.5px solid #ef4444; color: #ef4444;
    }
    .connected-box {
      background: #18181b; border-radius: 14px; padding: 14px 16px;
      margin-bottom: 20px; font-size: 0.9rem;
    }
    .business-card {
      background: #18181b; border-radius: 16px; padding: 18px;
      margin-bottom: 16px; border: 1px solid #27272a;
    }
    .business-card h3 { font-size: 1.1rem; margin-bottom: 4px; }
    .business-card .desc { color: #a1a1aa; font-size: 0.85rem; margin-bottom: 10px; }
    .token-id, .treasury { font-size: 0.8rem; color: #4ade80; margin-bottom: 6px; }
    .stats { display: flex; gap: 10px; margin: 12px 0; }
    .stat {
      flex: 1; background: #27272a; border-radius: 10px;
      padding: 10px; text-align: center;
    }
    .stat .label { font-size: 0.7rem; color: #a1a1aa; }
    .stat .value { font-weight: 600; margin-top: 2px; }
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.8rem; font-weight: 600; margin: 8px 0 12px;
    }
    .status-badge.live { color: #4ade80; }
    .status-badge.pending { color: #fbbf24; }
    .btn {
      width: 100%; padding: 13px; border-radius: 12px;
      border: none; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; margin-bottom: 8px;
    }
    .btn-green { background: #22c55e; color: #000; }
    .btn-outline {
      background: transparent; border: 1.5px solid #3f3f46; color: #e4e4e7;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .key-box {
      background: #0f172a; border: 1px solid #1e293b;
      border-radius: 12px; padding: 12px; margin-top: 12px;
      font-size: 0.75rem; word-break: break-all;
    }
    .key-box strong { color: #fbbf24; }
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%); background: #18181b;
      border: 1px solid #27272a; padding: 12px 20px;
      border-radius: 12px; font-size: 0.9rem; z-index: 100;
      max-width: 90%; text-align: center;
    }
    .toast.success { border-color: #22c55e; color: #4ade80; }
    .toast.error { border-color: #ef4444; color: #f87171; }
    .loading { text-align: center; color: #71717a; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">
        <div class="logo-box">⚡</div>
        <span>NEAR BUSINESS</span>
      </div>
      <a href="/" class="back">← Mint</a>
    </div>

    <div class="header">
      <h1>Owner Dashboard</h1>
      <div class="sub">Your Autonomous Businesses</div>
    </div>

    <!-- Connect / Disconnect buttons -->
    <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    <button id="disconnectBtn" class="disconnect-btn" style="display:none;">Disconnect Wallet</button>

    <div id="connectedBox" class="connected-box" style="display:none;"></div>

    <div id="list" class="loading">Connect your wallet to see your businesses</div>
  </div>

  <script>
    const CONTRACT_ID = "buildingfromthetop.testnet";
    const NETWORK = "testnet";

    let connector = null;
    let accountId = null;

    function showToast(msg, type = "info") {
      const t = document.createElement("div");
      t.className = `toast ${type}`;
      t.innerText = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 4500);
    }

    function toBase58(buffer) {
      const ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
      let digits = [0];
      for (let i = 0; i < buffer.length; i++) {
        let carry = buffer[i];
        for (let j = 0; j < digits.length; j++) {
          carry += digits[j] << 8;
          digits[j] = carry % 58;
          carry = (carry / 58) | 0;
        }
        while (carry) {
          digits.push(carry % 58);
          carry = (carry / 58) | 0;
        }
      }
      let str = "";
      for (let k = 0; buffer[k] === 0 && k < buffer.length - 1; k++) str += ALPHABET[0];
      for (let q = digits.length - 1; q >= 0; q--) str += ALPHABET[digits[q]];
      return str;
    }

    function generateKeyPair() {
      const kp = nacl.sign.keyPair();
      const publicKeyStr = "ed25519:" + toBase58(kp.publicKey);
      const privateKeyStr = "ed25519:" + toBase58(kp.secretKey);
      return { publicKeyStr, privateKeyStr };
    }

    function setConnectedUI(id) {
      accountId = id;
      document.getElementById("connectBtn").style.display = "none";
      document.getElementById("disconnectBtn").style.display = "block";
      document.getElementById("connectedBox").style.display = "block";
      document.getElementById("connectedBox").innerHTML = `Connected as<br><strong>${id}</strong>`;
      loadBusinesses();
    }

    function setDisconnectedUI() {
      accountId = null;
      document.getElementById("connectBtn").style.display = "block";
      document.getElementById("disconnectBtn").style.display = "none";
      document.getElementById("connectedBox").style.display = "none";
      document.getElementById("list").innerHTML = `<div class="loading">Connect your wallet to see your businesses</div>`;
    }

    async function init() {
      try {
        connector = new nearConnect.NearConnector({ network: NETWORK });

        connector.on("wallet:signIn", async (payload) => {
          const id = payload.accounts?.[0]?.accountId;
          if (id) setConnectedUI(id);
        });

        connector.on("wallet:signOut", () => {
          setDisconnectedUI();
        });

        // Try to restore existing session
        try {
          const wallet = await connector.wallet();
          const accounts = await wallet.getAccounts();
          if (accounts && accounts.length > 0) {
            setConnectedUI(accounts[0].accountId);
          }
        } catch (e) {
          // not connected yet
        }
      } catch (err) {
        console.error("Connector init error:", err);
        showToast("Wallet connector failed to load", "error");
      }

      // Connect button
      document.getElementById("connectBtn").onclick = async () => {
        try {
          await connector.connect();
        } catch (err) {
          console.error(err);
          showToast(err.message || "Failed to connect", "error");
        }
      };

      // Disconnect button
      document.getElementById("disconnectBtn").onclick = async () => {
        try {
          await connector.disconnect();
          setDisconnectedUI();
        } catch (err) {
          console.error(err);
        }
      };
    }

    async function loadBusinesses() {
      const listEl = document.getElementById("list");
      if (!accountId) {
        listEl.innerHTML = `<div class="loading">Connect your wallet to see your businesses</div>`;
        return;
      }

      listEl.innerHTML = `<div class="loading">Loading your businesses...</div>`;

      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "1",
            method: "query",
            params: {
              request_type: "call_function",
              finality: "final",
              account_id: CONTRACT_ID,
              method_name: "nft_tokens_for_owner",
              args_base64: btoa(JSON.stringify({ account_id: accountId }))
            }
          })
        });

        const data = await res.json();
        const bytes = data.result?.result;

        if (!bytes) {
          listEl.innerHTML = `<div class="loading">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        const tokens = JSON.parse(String.fromCharCode(...bytes));

        if (!tokens || tokens.length === 0) {
          listEl.innerHTML = `<div class="loading">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        listEl.innerHTML = "";

        for (const token of tokens) {
          const businessAccount = token.business_account || `business-\( {token.token_id}. \){CONTRACT_ID}`;
          let balance = "—";
          let isLive = false;

          try {
            const accRes = await fetch("https://rpc.testnet.near.org", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                jsonrpc: "2.0",
                id: "2",
                method: "query",
                params: {
                  request_type: "view_account",
                  finality: "final",
                  account_id: businessAccount
                }
              })
            });
            const accData = await accRes.json();
            if (accData.result) {
              balance = (parseFloat(accData.result.amount) / 1e24).toFixed(4);
              isLive = true;
            }
          } catch (e) {}

          const card = document.createElement("div");
          card.className = "business-card";
          card.innerHTML = `
            <h3>${token.metadata?.title || "Untitled Business"}</h3>
            <div class="desc">${token.metadata?.description || "No description"}</div>
            <div class="token-id">Token ID: ${token.token_id}</div>
            <div class="treasury">Treasury: ${businessAccount}</div>
            <div class="stats">
              <div class="stat">
                <div class="label">Treasury Balance</div>
                <div class="value">${balance} Ⓝ</div>
              </div>
              <div class="stat">
                <div class="label">Status</div>
                <div class="value">${isLive ? "Live" : "Pending"}</div>
              </div>
            </div>
            <div class="status-badge ${isLive ? "live" : "pending"}">
              ${isLive ? "● Active" : "○ Pending Activation"}
            </div>
            <div class="actions"></div>
          `;

          const actions = card.querySelector(".actions");

          if (!isLive) {
            const activateBtn = document.createElement("button");
            activateBtn.className = "btn btn-green";
            activateBtn.innerText = "Activate Business";
            activateBtn.onclick = () => activateBusiness(token.token_id, businessAccount, activateBtn);
            actions.appendChild(activateBtn);
          } else {
            const activated = document.createElement("button");
            activated.className = "btn btn-green";
            activated.innerText = "Activated ✓";
            activated.disabled = true;
            actions.appendChild(activated);

            const claimBtn = document.createElement("button");
            claimBtn.className = "btn btn-outline";
            claimBtn.innerText = "Claim Revenue";
            claimBtn.onclick = () => {
              showToast("To claim: transfer funds from the business account using the agent private key.", "info");
            };
            actions.appendChild(claimBtn);

            const sellBtn = document.createElement("button");
            sellBtn.className = "btn btn-outline";
            sellBtn.innerText = "Sell / Transfer NFT";
            sellBtn.onclick = () => {
              showToast("Transfer the NFT via any NEP-171 marketplace. New owner inherits the business.", "info");
            };
            actions.appendChild(sellBtn);
          }

          listEl.appendChild(card);
        }
      } catch (err) {
        console.error(err);
        listEl.innerHTML = `<div class="loading">Failed to load businesses. Try reconnecting.</div>`;
      }
    }

    async function activateBusiness(tokenId, businessAccount, btn) {
      btn.disabled = true;
      btn.innerText = "Generating key...";

      try {
        const { publicKeyStr, privateKeyStr } = generateKeyPair();

        // Show private key immediately so user can copy
        const keyBox = document.createElement("div");
        keyBox.className = "key-box";
        keyBox.innerHTML = `
          <strong>⚠️ SAVE THIS PRIVATE KEY NOW</strong><br><br>
          ${privateKeyStr}<br><br>
          <button onclick="navigator.clipboard.writeText('${privateKeyStr}'); this.innerText='Copied!';" 
                  style="margin-top:8px;padding:6px 12px;border-radius:8px;border:none;background:#22c55e;color:#000;font-weight:600;cursor:pointer;">
            Copy Private Key
          </button>
        `;
        btn.parentNode.appendChild(keyBox);

        btn.innerText = "Confirm in wallet...";
        showToast("Key generated – confirm the transaction in your wallet", "info");

        const wallet = await connector.wallet();

        await wallet.signAndSendTransaction({
          receiverId: businessAccount,
          actions: [
            { type: "CreateAccount" },
            {
              type: "AddKey",
              params: {
                publicKey: publicKeyStr,
                accessKey: {
                  nonce: 0,
                  permission: {
                    receiverId: businessAccount,
                    methodNames: [],
                    allowance: "250000000000000000000000"
                  }
                }
              }
            },
            {
              type: "Transfer",
              params: { deposit: "100000000000000000000000" }
            }
          ]
        });

        btn.innerText = "Activated ✓";
        btn.disabled = true;
        showToast("Business activated + agent key granted! Copy the private key above.", "success");

        // Give user time to copy the key
        setTimeout(() => {
          loadBusinesses();
        }, 15000);

      } catch (err) {
        console.error(err);
        showToast(err.message || "Activation failed", "error");
        btn.disabled = false;
        btn.innerText = "Activate Business";
      }
    }

    init();
  </script>
</body>
</html>
