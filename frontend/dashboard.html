<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Owner Dashboard – Autonomous Business NFT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #050508;
      color: #f4f4f5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 16px 80px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 20px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
    }
    .logo-box {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }
    .back {
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .header .sub {
      color: #a1a1aa;
      font-size: 0.95rem;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-secondary {
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      margin-bottom: 12px;
    }
    .btn-disconnect {
      background: transparent;
      border: 1px solid #ef4444;
      color: #f87171;
      margin-bottom: 14px;
      padding: 12px;
      font-size: 0.95rem;
      display: none;
    }
    .btn-activate {
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: white;
      margin-top: 12px;
      padding: 12px;
      font-size: 0.95rem;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .account-box {
      background: #0f0f12;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 20px;
      display: none;
    }
    .account-box .label {
      font-size: 0.75rem;
      color: #a1a1aa;
      margin-bottom: 4px;
    }
    .account-box .value {
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-all;
    }
    .business-list {
      margin-top: 10px;
    }
    .business-item {
      background: #0f0f12;
      border: 1px solid #27272a;
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 14px;
    }
    .business-item h4 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .business-item p {
      color: #a1a1aa;
      font-size: 0.88rem;
      margin-bottom: 10px;
    }
    .token-id {
      font-size: 0.78rem;
      color: #71717a;
      margin-bottom: 4px;
    }
    .business-account {
      font-size: 0.78rem;
      color: #4ade80;
      word-break: break-all;
      margin-bottom: 8px;
    }
    .status {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      display: none;
    }
    .status.success {
      background: #14532d;
      color: #bbf7d0;
      display: block;
    }
    .status.error {
      background: #450a0a;
      color: #fecaca;
      display: block;
    }
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #71717a;
      font-size: 0.95rem;
    }
    .loading {
      text-align: center;
      padding: 30px;
      color: #a1a1aa;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">
        <div class="logo-box">◈</div>
        <span>Business NFT</span>
      </div>
      <a href="index.html" class="back">← Mint</a>
    </div>

    <div class="header">
      <h1>Owner Dashboard</h1>
      <div class="sub">Your Autonomous Businesses</div>
    </div>

    <button class="btn btn-secondary" id="connectBtn">
      Connect Wallet
    </button>

    <button class="btn btn-disconnect" id="disconnectBtn">
      Disconnect Wallet
    </button>

    <div class="account-box" id="accountBox">
      <div class="label">Connected as</div>
      <div class="value" id="accountDisplay"></div>
    </div>

    <div id="status" class="status"></div>

    <div class="business-list" id="businessList">
      <div class="empty">Connect wallet to see your businesses</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "@hot-labs/near-connect": "https://esm.sh/@hot-labs/near-connect@0.12.0"
    }
  }
  </script>

  <script type="module">
    import { NearConnector } from "@hot-labs/near-connect";

    const CONTRACT_ID = "buildingfromthetop.testnet";

    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const accountBox = document.getElementById("accountBox");
    const accountDisplay = document.getElementById("accountDisplay");
    const businessList = document.getElementById("businessList");
    const statusEl = document.getElementById("status");

    let connector = null;
    let accountId = null;

    async function init() {
      connector = new NearConnector({
        network: "testnet",
        features: {
          signAndSendTransaction: true,
          testnet: true
        }
      });

      connector.on("wallet:signIn", async (event) => {
        accountId = event.accounts[0]?.accountId || null;
        updateUI();
        if (accountId) loadBusinesses();
      });

      connector.on("wallet:signOut", () => {
        accountId = null;
        updateUI();
        businessList.innerHTML = `<div class="empty">Connect wallet to see your businesses</div>`;
      });

      try {
        const wallet = await connector.wallet();
        const accounts = await wallet.getAccounts();
        if (accounts && accounts.length > 0) {
          accountId = accounts[0].accountId;
          updateUI();
          loadBusinesses();
        }
      } catch (e) {}
    }

    function updateUI() {
      if (accountId) {
        connectBtn.style.display = "none";
        disconnectBtn.style.display = "block";
        accountBox.style.display = "block";
        accountDisplay.innerText = accountId;
      } else {
        connectBtn.style.display = "block";
        connectBtn.innerText = "Connect Wallet";
        disconnectBtn.style.display = "none";
        accountBox.style.display = "none";
      }
    }

    connectBtn.addEventListener("click", async () => {
      if (accountId) return;
      try {
        await connector.connect();
      } catch (err) {
        console.error(err);
        showStatus(err.message || "Connection cancelled", "error");
      }
    });

    disconnectBtn.addEventListener("click", async () => {
      try {
        if (connector) {
          await connector.disconnect();
        }
      } catch (e) {}
      accountId = null;
      updateUI();
      businessList.innerHTML = `<div class="empty">Connect wallet to see your businesses</div>`;
      statusEl.style.display = "none";
    });

    function showStatus(msg, type) {
      statusEl.className = "status " + type;
      statusEl.style.display = "block";
      statusEl.innerText = msg;
    }

    async function loadBusinesses() {
      if (!accountId) return;

      businessList.innerHTML = `<div class="loading">Loading your businesses...</div>`;

      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "dontcare",
            method: "query",
            params: {
              request_type: "call_function",
              finality: "final",
              account_id: CONTRACT_ID,
              method_name: "nft_tokens_for_owner",
              args_base64: btoa(JSON.stringify({ account_id: accountId }))
            }
          })
        });

        const data = await res.json();
        const bytes = data.result?.result;

        if (!bytes) {
          businessList.innerHTML = `<div class="empty">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        const tokens = JSON.parse(String.fromCharCode(...bytes));

        if (!tokens || tokens.length === 0) {
          businessList.innerHTML = `<div class="empty">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        businessList.innerHTML = "";
        tokens.forEach(token => {
          const div = document.createElement("div");
          div.className = "business-item";

          const title = token.metadata?.title || "Untitled Business";
          const description = token.metadata?.description || "No description";
          const tokenId = token.token_id;

          // Reconstruct account name safely
          const businessAccount = "business-" + tokenId + "." + CONTRACT_ID;

          div.innerHTML = `
            <h4>${title}</h4>
            <p>${description}</p>
            <div class="token-id">Token ID: ${tokenId}</div>
            <div class="business-account">Treasury: ${businessAccount}</div>
            <button class="btn btn-activate" data-token="${tokenId}">
              Activate Business
            </button>
            <div class="status" style="display:none; margin-top:10px;"></div>
          `;

          businessList.appendChild(div);
        });

        // Attach click handlers — reconstruct account name HERE
        document.querySelectorAll(".btn-activate").forEach(btn => {
          btn.addEventListener("click", async () => {
            const tokenId = btn.getAttribute("data-token");
            const businessAccount = "business-" + tokenId + "." + CONTRACT_ID;
            await activateBusiness(tokenId, businessAccount, btn);
          });
        });

      } catch (err) {
        console.error(err);
        businessList.innerHTML = `<div class="empty">Failed to load businesses</div>`;
      }
    }

    async function activateBusiness(tokenId, businessAccount, btn) {
      if (!accountId) {
        showStatus("Please connect wallet first", "error");
        return;
      }

      const statusDiv = btn.nextElementSibling;

      try {
        btn.disabled = true;
        btn.innerText = "Confirm in wallet...";
        statusDiv.style.display = "block";
        statusDiv.className = "status";
        statusDiv.innerText = "Creating sub-account... Confirm in your wallet";

        const wallet = await connector.wallet();

        // This is the correct NEAR pattern for creating a sub-account
        await wallet.signAndSendTransaction({
          receiverId: businessAccount,
          actions: [
            {
              type: "CreateAccount"
            },
            {
              type: "Transfer",
              params: {
                deposit: "100000000000000000000000" // 0.1 NEAR
              }
            }
          ]
        });

        statusDiv.className = "status success";
        statusDiv.innerText = "✅ Business activated! Sub-account created.";
        btn.innerText = "Activated ✓";
      } catch (err) {
        console.error(err);
        statusDiv.className = "status error";
        statusDiv.style.display = "block";
        statusDiv.innerText = err.message || "Activation failed or cancelled";
        btn.disabled = false;
        btn.innerText = "Activate Business";
      }
    }

    init();
  </script>
</body>
</html>
