<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Owner Dashboard – Autonomous Business NFT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #050508;
      color: #f4f4f5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 440px; margin: 0 auto; padding: 16px 16px 80px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0 20px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .logo-box {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 9px; display: grid; place-items: center;
      font-size: 16px;
    }
    .back { color: #a1a1aa; text-decoration: none; font-size: 0.9rem; }
    .header { margin-bottom: 20px; }
    .header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .header .sub { color: #a1a1aa; font-size: 0.9rem; }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 14px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: #22c55e; color: #000; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-danger {
      background: transparent; border: 1.5px solid #ef4444; color: #ef4444;
      margin-top: 10px;
    }
    .btn-disabled {
      background: #166534; color: #86efac; cursor: default;
    }

    .account-box {
      background: #18181b; border: 1px solid #27272a;
      border-radius: 14px; padding: 14px 16px; margin: 16px 0;
      font-size: 0.9rem;
    }
    .account-box span { color: #a1a1aa; display: block; font-size: 0.8rem; margin-bottom: 2px; }

    .business-card {
      background: #18181b; border: 1px solid #27272a;
      border-radius: 18px; padding: 18px; margin-bottom: 16px;
    }
    .business-card h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .business-card .desc { color: #a1a1aa; font-size: 0.9rem; margin-bottom: 10px; }
    .meta { font-size: 0.8rem; color: #71717a; margin-bottom: 4px; }
    .treasury { color: #4ade80; font-size: 0.85rem; margin-bottom: 8px; font-weight: 500; }
    .balance { color: #fbbf24; font-size: 0.9rem; margin-bottom: 12px; }

    .status-badge {
      display: inline-block; font-size: 0.75rem; font-weight: 600;
      padding: 4px 10px; border-radius: 20px; margin-bottom: 12px;
    }
    .badge-active { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-pending { background: rgba(251,191,36,0.12); color: #fbbf24; }

    .status-msg {
      margin-top: 10px; padding: 10px 14px; border-radius: 12px;
      font-size: 0.85rem; display: none;
    }
    .status-msg.success { background: rgba(34,197,94,0.12); color: #4ade80; display: block; }
    .status-msg.error { background: rgba(239,68,68,0.12); color: #f87171; display: block; }
    .status-msg.info { background: rgba(59,130,246,0.12); color: #60a5fa; display: block; }

    .empty { text-align: center; color: #71717a; padding: 40px 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">
        <div class="logo-box">◆</div>
        <span>Business NFT</span>
      </div>
      <a href="/" class="back">← Mint</a>
    </div>

    <div class="header">
      <h1>Owner Dashboard</h1>
      <div class="sub">Your Autonomous Businesses</div>
    </div>

    <button id="connectBtn" class="btn btn-primary">Connect Wallet</button>
    <button id="disconnectBtn" class="btn btn-danger" style="display:none;">Disconnect Wallet</button>

    <div id="accountBox" class="account-box" style="display:none;">
      <span>Connected as</span>
      <strong id="accountIdDisplay"></strong>
    </div>

    <div id="list" style="margin-top:20px;">
      <div class="empty">Connect wallet to see your businesses</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "@hot-labs/near-connect": "https://esm.sh/@hot-labs/near-connect@0.12.0"
    }
  }
  </script>

  <script type="module">
    import { NearConnector } from "@hot-labs/near-connect";

    const CONTRACT_ID = "buildingfromthetop.testnet";
    const NETWORK = "testnet";

    let connector = null;
    let accountId = null;

    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const accountBox = document.getElementById("accountBox");
    const accountIdDisplay = document.getElementById("accountIdDisplay");
    const listEl = document.getElementById("list");

    async function init() {
      connector = new NearConnector({
        network: NETWORK,
        autoConnect: true,
        features: { signAndSendTransaction: true }
      });

      // Event listeners
      connector.on("wallet:signIn", async (event) => {
        try {
          const accounts = event?.accounts || (await connector.getConnectedWallet()).accounts;
          if (accounts && accounts.length > 0) {
            accountId = accounts[0].accountId;
            updateUI();
            loadBusinesses();
          }
        } catch (e) {
          console.error("signIn handler error", e);
        }
      });

      connector.on("wallet:signOut", () => {
        accountId = null;
        updateUI();
        listEl.innerHTML = `<div class="empty">Connect wallet to see your businesses</div>`;
      });

      // === THE KEY RESTORE METHOD (this is what worked before) ===
      try {
        // Small delay so the connector finishes loading the manifest + storage
        await new Promise(r => setTimeout(r, 400));

        const connected = await connector.getConnectedWallet();
        if (connected && connected.accounts && connected.accounts.length > 0) {
          accountId = connected.accounts[0].accountId;
          updateUI();
          loadBusinesses();
          return;
        }
      } catch (e) {
        // No existing session – this is normal
        console.log("No existing session found");
      }
    }

    function updateUI() {
      if (accountId) {
        connectBtn.style.display = "none";
        disconnectBtn.style.display = "block";
        accountBox.style.display = "block";
        accountIdDisplay.innerText = accountId;
      } else {
        connectBtn.style.display = "block";
        disconnectBtn.style.display = "none";
        accountBox.style.display = "none";
      }
    }

    connectBtn.addEventListener("click", async () => {
      try {
        await connector.connect();
      } catch (e) {
        console.error(e);
      }
    });

    disconnectBtn.addEventListener("click", async () => {
      try {
        await connector.disconnect();
        accountId = null;
        updateUI();
        listEl.innerHTML = `<div class="empty">Connect wallet to see your businesses</div>`;
      } catch (e) {
        console.error(e);
      }
    });

    async function getAccountBalance(accountId) {
      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "dontcare",
            method: "query",
            params: {
              request_type: "view_account",
              finality: "final",
              account_id: accountId
            }
          })
        });
        const data = await res.json();
        if (data.result && data.result.amount) {
          const yocto = BigInt(data.result.amount);
          const near = Number(yocto) / 1e24;
          return near.toFixed(4);
        }
        return "0.0000";
      } catch (e) {
        return "—";
      }
    }

    async function loadBusinesses() {
      if (!accountId) return;

      listEl.innerHTML = `<div class="empty">Loading your businesses...</div>`;

      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "dontcare",
            method: "query",
            params: {
              request_type: "call_function",
              finality: "final",
              account_id: CONTRACT_ID,
              method_name: "nft_tokens_for_owner",
              args_base64: btoa(JSON.stringify({ account_id: accountId }))
            }
          })
        });

        const data = await res.json();
        const bytes = data.result?.result;

        if (!bytes) {
          listEl.innerHTML = `<div class="empty">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        const tokens = JSON.parse(String.fromCharCode(...bytes));

        if (!tokens || tokens.length === 0) {
          listEl.innerHTML = `<div class="empty">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        listEl.innerHTML = "";

        for (const token of tokens) {
          const tokenId = token.token_id;
          const businessAccount = "business-" + tokenId + "." + CONTRACT_ID;
          const title = token.metadata?.title || "Untitled Business";
          const description = token.metadata?.description || "No description";

          const balance = await getAccountBalance(businessAccount);
          const isActivated = balance !== "—" && parseFloat(balance) > 0;

          const card = document.createElement("div");
          card.className = "business-card";
          card.innerHTML = `
            <h3>${title}</h3>
            <div class="desc">${description}</div>
            <div class="meta">Token ID: ${tokenId}</div>
            <div class="treasury">Treasury: ${businessAccount}</div>
            <div class="balance">Balance: ${isActivated ? balance + " NEAR" : "Not created yet"}</div>
            <div class="status-badge ${isActivated ? "badge-active" : "badge-pending"}">
              ${isActivated ? "● Active" : "○ Pending Activation"}
            </div>
            <div id="actions-${tokenId}"></div>
            <div id="status-${tokenId}" class="status-msg"></div>
          `;
          listEl.appendChild(card);

          const actionsEl = document.getElementById("actions-" + tokenId);
          const statusEl = document.getElementById("status-" + tokenId);

          if (!isActivated) {
            const activateBtn = document.createElement("button");
            activateBtn.className = "btn btn-primary";
            activateBtn.innerText = "Activate Business";
            activateBtn.onclick = () => activateBusiness(tokenId, businessAccount, activateBtn, statusEl);
            actionsEl.appendChild(activateBtn);
          } else {
            const activatedBtn = document.createElement("button");
            activatedBtn.className = "btn btn-disabled";
            activatedBtn.innerText = "Activated ✓";
            activatedBtn.disabled = true;
            actionsEl.appendChild(activatedBtn);
          }
        }
      } catch (err) {
        console.error(err);
        listEl.innerHTML = `<div class="empty">Failed to load businesses</div>`;
      }
    }

    async function activateBusiness(tokenId, businessAccount, btn, statusEl) {
      try {
        btn.disabled = true;
        btn.innerText = "Confirm in wallet...";
        statusEl.className = "status-msg info";
        statusEl.style.display = "block";
        statusEl.innerText = "Creating sub-account... Confirm in your wallet";

        const wallet = await connector.wallet();

        await wallet.signAndSendTransaction({
          receiverId: businessAccount,
          actions: [
            { type: "CreateAccount" },
            {
              type: "Transfer",
              params: { deposit: "100000000000000000000000" } // 0.1 NEAR
            }
          ]
        });

        statusEl.className = "status-msg success";
        statusEl.innerText = "✅ Business activated! Sub-account created.";
        btn.className = "btn btn-disabled";
        btn.innerText = "Activated ✓";
        btn.disabled = true;

        setTimeout(() => loadBusinesses(), 2500);
      } catch (err) {
        console.error(err);
        statusEl.className = "status-msg error";
        statusEl.style.display = "block";
        statusEl.innerText = err.message || "Activation failed or cancelled";
        btn.disabled = false;
        btn.innerText = "Activate Business";
      }
    }

    init();
  </script>
</body>
</html>
