<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Owner Dashboard – Autonomous Business NFT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #050508;
      color: #f4f4f5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 440px; margin: 0 auto; padding: 16px 16px 80px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0 16px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .logo-box {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 9px; display: grid; place-items: center;
    }
    .back { color: #a1a1aa; text-decoration: none; font-size: 0.9rem; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      background: #18181b;
      border: 1px solid #27272a;
      color: #a1a1aa;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .tab.active {
      background: #22c55e;
      color: #000;
      border-color: #22c55e;
    }

    .header { margin-bottom: 20px; }
    .header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .header .sub { color: #a1a1aa; font-size: 0.9rem; }
    .account-box {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-green { background: #22c55e; color: #000; }
    .btn-red { background: transparent; border: 1px solid #ef4444; color: #ef4444; }
    .btn-outline {
      background: transparent;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
    }
    .btn-purple {
      background: transparent;
      border: 1px solid #a855f7;
      color: #c084fc;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .business-card {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .business-card h3 { font-size: 1.15rem; margin-bottom: 6px; }
    .business-card p { color: #a1a1aa; font-size: 0.9rem; margin-bottom: 10px; }
    .token-id { font-size: 0.8rem; color: #71717a; margin-bottom: 8px; }
    .treasury { color: #4ade80; font-size: 0.85rem; word-break: break-all; margin-bottom: 12px; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: #18181b;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .stat .label { font-size: 0.75rem; color: #71717a; }
    .stat .value { font-size: 1.05rem; font-weight: 600; margin-top: 2px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .badge-live { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-pending { background: rgba(234,179,8,0.15); color: #eab308; }
    .status-msg {
      font-size: 0.85rem;
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }
    .status-msg.error { background: rgba(239,68,68,0.15); color: #f87171; display: block; }
    .status-msg.success { background: rgba(34,197,94,0.15); color: #4ade80; display: block; }
    .status-msg.info { background: rgba(59,130,246,0.15); color: #60a5fa; display: block; }
    .key-box {
      background: #0c0c0e;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      font-family: monospace;
      font-size: 0.72rem;
      word-break: break-all;
      display: none;
    }
    .key-box.show { display: block; }
    .warning {
      background: rgba(234,179,8,0.12);
      color: #eab308;
      font-size: 0.78rem;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      line-height: 1.4;
    }
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }
    .info-panel {
      background: #0c0c0e;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      font-size: 0.85rem;
      line-height: 1.5;
      display: none;
      white-space: pre-wrap;
    }
    .info-panel.show { display: block; }
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      max-width: 90%;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    #toast.show { opacity: 1; }
    #toast.error { border-color: #ef4444; color: #f87171; }
    #toast.success { border-color: #22c55e; color: #4ade80; }

    /* Agent Control */
    .section { display: none; }
    .section.active { display: block; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #a1a1aa;
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: #111114;
      border: 1px solid #27272a;
      color: #f4f4f5;
      font-size: 0.9rem;
    }
    .form-group textarea {
      min-height: 90px;
      resize: vertical;
      font-family: monospace;
      font-size: 0.8rem;
    }
    .agent-result {
      background: #0c0c0e;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
      font-size: 0.85rem;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">
        <div class="logo-box">◆</div>
        <span>Business NFT</span>
      </div>
      <a href="/" class="back">← Mint</a>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" id="tabDashboard" onclick="switchTab('dashboard')">Dashboard</div>
      <div class="tab" id="tabAgent" onclick="switchTab('agent')">Agent Control</div>
    </div>

    <!-- ===================== DASHBOARD SECTION ===================== -->
    <div id="dashboardSection" class="section active">
      <div class="header">
        <h1>Owner Dashboard</h1>
        <div class="sub">Your Autonomous Businesses</div>
      </div>

      <button id="connectBtn" class="btn btn-green">Connect Wallet</button>
      <button id="disconnectBtn" class="btn btn-red" style="display:none;">Disconnect Wallet</button>

      <div id="accountBox" class="account-box" style="display:none;">
        Connected as<br>
        <strong id="accountIdDisplay"></strong>
      </div>

      <div id="list"></div>
    </div>

    <!-- ===================== AGENT CONTROL SECTION ===================== -->
    <div id="agentSection" class="section">
      <div class="header">
        <h1>Agent Control</h1>
        <div class="sub">Use the Function-Call key to control the business</div>
      </div>

      <div class="form-group">
        <label>Business Account</label>
        <input type="text" id="agentBusinessAccount" placeholder="business-10.buildingfromthetop.testnet" />
      </div>

      <div class="form-group">
        <label>Private Key (ed25519:...)</label>
        <textarea id="agentPrivateKey" placeholder="Paste the private key you copied during activation"></textarea>
      </div>

      <div class="form-group">
        <label>OutLayer API Key (wk_...)</label>
        <input type="text" id="outlayerApiKey" placeholder="wk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" />
      </div>

      <button class="btn btn-green" onclick="checkAgentBalance()">Check Treasury Balance</button>
      <button class="btn btn-outline" onclick="checkOutlayerBalance()">Check OutLayer Balance</button>
      <button class="btn btn-outline" onclick="toggleAgentInfo()">How to run full Agent</button>

      <div id="agentResult" class="agent-result"></div>
      <div id="agentInfoPanel" class="info-panel"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "@hot-labs/near-connect": "https://esm.sh/@hot-labs/near-connect@0.12.0"
    }
  }
  </script>

  <script type="module">
    import { NearConnector } from "@hot-labs/near-connect";

    const CONTRACT_ID = "buildingfromthetop.testnet";
    const NETWORK = "testnet";
    const OUTLAYER_API = "https://testnet-api.outlayer.ai";

    let connector = null;
    let accountId = null;

    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const accountBox = document.getElementById("accountBox");
    const accountIdDisplay = document.getElementById("accountIdDisplay");
    const listEl = document.getElementById("list");
    const toastEl = document.getElementById("toast");

    window.switchTab = function(tab) {
      document.getElementById("dashboardSection").classList.toggle("active", tab === "dashboard");
      document.getElementById("agentSection").classList.toggle("active", tab === "agent");
      document.getElementById("tabDashboard").classList.toggle("active", tab === "dashboard");
      document.getElementById("tabAgent").classList.toggle("active", tab === "agent");
    };

    function showToast(message, type = "info") {
      toastEl.textContent = message;
      toastEl.className = "show " + type;
      clearTimeout(toastEl._timer);
      toastEl._timer = setTimeout(() => {
        toastEl.className = "";
      }, 4000);
    }

    function toBase58(bytes) {
      const ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
      let num = BigInt(0);
      for (let i = 0; i < bytes.length; i++) {
        num = (num << 8n) + BigInt(bytes[i]);
      }
      let str = "";
      while (num > 0n) {
        str = ALPHABET[Number(num % 58n)] + str;
        num = num / 58n;
      }
      for (let i = 0; i < bytes.length && bytes[i] === 0; i++) {
        str = "1" + str;
      }
      return str;
    }

    function generateKeyPair() {
      if (typeof nacl === "undefined") {
        throw new Error("Crypto library not loaded. Please refresh.");
      }
      const kp = nacl.sign.keyPair();
      const seed = kp.secretKey.slice(0, 32);
      const publicKey = kp.publicKey;
      return {
        privateKeyStr: "ed25519:" + toBase58(seed),
        publicKeyStr: "ed25519:" + toBase58(publicKey)
      };
    }

    async function getAccountBalance(accountId) {
      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "1",
            method: "query",
            params: {
              request_type: "view_account",
              finality: "final",
              account_id: accountId
            }
          })
        });
        const data = await res.json();
        if (data.result && data.result.amount) {
          return (Number(data.result.amount) / 1e24).toFixed(4);
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    async function registerOutlayerWallet() {
      try {
        const res = await fetch(OUTLAYER_API + "/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" }
        });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    function updateUI() {
      if (accountId) {
        connectBtn.style.display = "none";
        disconnectBtn.style.display = "block";
        accountBox.style.display = "block";
        accountIdDisplay.textContent = accountId;
      } else {
        connectBtn.style.display = "block";
        disconnectBtn.style.display = "none";
        accountBox.style.display = "none";
        listEl.innerHTML = "";
      }
    }

    async function init() {
      connector = new NearConnector({
        network: NETWORK,
        features: { signAndSendTransaction: true },
        autoConnect: true
      });

      connector.on("wallet:signIn", async () => {
        const connected = await connector.getConnectedWallet();
        if (connected?.accounts?.length) {
          accountId = connected.accounts[0].accountId;
          updateUI();
          loadBusinesses();
        }
      });

      connector.on("wallet:signOut", () => {
        accountId = null;
        updateUI();
      });

      await new Promise(r => setTimeout(r, 500));
      try {
        const connected = await connector.getConnectedWallet();
        if (connected?.accounts?.length) {
          accountId = connected.accounts[0].accountId;
          updateUI();
          loadBusinesses();
        }
      } catch (e) {}
    }

    connectBtn.addEventListener("click", async () => {
      try {
        await connector.connect();
      } catch (err) {
        showToast(err.message || "Connect failed", "error");
      }
    });

    disconnectBtn.addEventListener("click", async () => {
      try {
        await connector.disconnect();
        accountId = null;
        updateUI();
      } catch (err) {}
    });

    async function loadBusinesses() {
      if (!accountId) return;
      listEl.innerHTML = `<div style="color:#a1a1aa;padding:20px 0;text-align:center;">Loading your businesses...</div>`;

      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "1",
            method: "query",
            params: {
              request_type: "call_function",
              finality: "final",
              account_id: CONTRACT_ID,
              method_name: "nft_tokens_for_owner",
              args_base64: btoa(JSON.stringify({ account_id: accountId }))
            }
          })
        });

        const data = await res.json();
        const bytes = data.result?.result;
        if (!bytes) {
          listEl.innerHTML = `<div style="color:#a1a1aa;padding:20px 0;text-align:center;">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        const tokens = JSON.parse(String.fromCharCode(...bytes));
        if (!tokens || tokens.length === 0) {
          listEl.innerHTML = `<div style="color:#a1a1aa;padding:20px 0;text-align:center;">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        listEl.innerHTML = "";

        for (const token of tokens) {
          const tokenId = String(token.token_id);
          const businessAccount = "business-" + tokenId + "." + CONTRACT_ID;
          const title = token.metadata?.title || "Untitled";
          const description = token.metadata?.description || "No description";

          const balance = await getAccountBalance(businessAccount);
          const isActive = balance !== null;

          const card = document.createElement("div");
          card.className = "business-card";
          card.innerHTML = `
            <h3>${title}</h3>
            <p>${description}</p>
            <div class="token-id">Token ID: ${tokenId}</div>
            <div class="treasury">Treasury: ${businessAccount}</div>
            <div class="stats">
              <div class="stat">
                <div class="label">Treasury Balance</div>
                <div class="value">${isActive ? balance + " Ⓝ" : "—"}</div>
              </div>
              <div class="stat">
                <div class="label">Status</div>
                <div class="value">${isActive ? "Live" : "Pending"}</div>
              </div>
            </div>
            <div class="badge ${isActive ? "badge-live" : "badge-pending"}">
    ${isActive ? "● Active" : "○ Pending Activation"}
  </div>

  <div style="margin-top:10px; padding:8px 12px; background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.25); border-radius:10px; font-size:0.85rem; color:#4ade80;">
    ● Agent Status: Ready (under the hood)
  </div>

  <button class="btn btn-green activate-btn" ${isActive ? "disabled" : ""}>
              ${isActive ? "Activated ✓" : "Activate Business"}
            </button>

            ${isActive ? `
              <div class="action-row">
                <button class="btn btn-outline claim-btn">Claim Revenue</button>
                <button class="btn btn-purple transfer-btn">Sell / Transfer</button>
              </div>
            ` : ""}

            <div class="status-msg"></div>
            <div class="key-box"></div>
            <div class="info-panel transfer-info"></div>
          `;
          listEl.appendChild(card);
        }

        // Activate buttons
        // Claim Revenue buttons - REAL withdrawal
document.querySelectorAll(".claim-btn").forEach(btn => {
  btn.addEventListener("click", async () => {
    const card = btn.closest(".business-card");
    const statusEl = card.querySelector(".status-msg");
    const treasuryText = card.querySelector(".treasury")?.textContent || "";
    const businessAccount = treasuryText.replace("Treasury:", "").trim();

    if (!businessAccount) {
      showToast("Business account not found", "error");
      return;
    }

    try {
      btn.disabled = true;
      btn.innerText = "Claiming...";
      if (statusEl) {
        statusEl.className = "status-msg info";
        statusEl.innerText = "Preparing real claim... Confirm in your wallet";
      }

      // Get current balance first
      const balance = await getAccountBalance(businessAccount);
      if (!balance || Number(balance) < 0.01) {
        throw new Error("Treasury balance too low to claim (need at least 0.01 NEAR)");
      }

      // Leave a tiny amount for storage (0.005 NEAR) and claim the rest
      const claimAmountYocto = Math.floor((Number(balance) - 0.005) * 1e24).toString();

      const wallet = await connector.wallet();
      await wallet.signAndSendTransaction({
        receiverId: businessAccount,
        actions: [
          {
            type: "Transfer",
            params: {
              deposit: claimAmountYocto
            }
          }
        ]
      });

      if (statusEl) {
        statusEl.className = "status-msg success";
        statusEl.innerText = `✅ Claimed \~${(Number(balance) - 0.005).toFixed(4)} NEAR to your wallet`;
      }
      showToast("Revenue claimed successfully", "success");
      setTimeout(() => loadBusinesses(), 5000);
    } catch (err) {
      if (statusEl) {
        statusEl.className = "status-msg error";
        statusEl.innerText = err.message || "Claim failed or cancelled";
      }
      showToast(err.message || "Claim failed", "error");
      btn.disabled = false;
      btn.innerText = "Claim Revenue";
    }
  });
});

        // Claim Revenue buttons
        document.querySelectorAll(".claim-btn").forEach(btn => {
          btn.addEventListener("click", async () => {
            const card = btn.closest(".business-card");
            const statusEl = card.querySelector(".status-msg");
            const treasuryText = card.querySelector(".treasury")?.textContent || "";
            const businessAccount = treasuryText.replace("Treasury:", "").trim();

            try {
              btn.disabled = true;
              btn.innerText = "Claiming...";
              if (statusEl) {
                statusEl.className = "status-msg info";
                statusEl.innerText = "Preparing claim transaction... Confirm in your wallet";
              }

              const wallet = await connector.wallet();
              await wallet.signAndSendTransaction({
                receiverId: businessAccount,
                actions: [
                  {
                    type: "Transfer",
                    params: {
                      deposit: "1000000000000000000000"
                    }
                  }
                ]
              });

              if (statusEl) {
                statusEl.className = "status-msg success";
                statusEl.innerText = "✅ Test claim successful! (0.001 NEAR sent to you)";
              }
              showToast("Revenue claimed successfully", "success");
              setTimeout(() => loadBusinesses(), 4000);
            } catch (err) {
              if (statusEl) {
                statusEl.className = "status-msg error";
                statusEl.innerText = err.message || "Claim failed or cancelled";
              }
              showToast(err.message || "Claim failed", "error");
              btn.disabled = false;
              btn.innerText = "Claim Revenue";
            }
          });
        });

        // Sell / Transfer buttons
        document.querySelectorAll(".transfer-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const card = btn.closest(".business-card");
            const infoPanel = card.querySelector(".transfer-info");
            const tokenIdText = card.querySelector(".token-id")?.textContent || "";
            const tokenId = tokenIdText.replace("Token ID:", "").trim();

            if (infoPanel.classList.contains("show")) {
              infoPanel.classList.remove("show");
              return;
            }

            infoPanel.classList.add("show");
            infoPanel.innerHTML = `
<strong>How to Sell / Transfer this NFT</strong>

1. Open any NEAR NFT marketplace that supports testnet (or use near-cli).

2. Transfer the NFT using the standard NEP-171 method:

   nft_transfer
   • receiver_id → the buyer’s account
   • token_id → ${tokenId}

3. After the NFT is transferred, the new owner automatically becomes the controller of the business account (business-\( {tokenId}. \){CONTRACT_ID}).

4. The Function-Call key remains valid for the agent. The new owner can also generate a new key if they want.

Currently there is no built-in marketplace UI. Use:
• Paras (testnet)
• near-cli
• or any wallet that supports NFT transfer
            `;
          });
        });

      } catch (err) {
        listEl.innerHTML = `<div style="color:#f87171;padding:20px 0;text-align:center;">Failed to load businesses</div>`;
        showToast("Failed to load businesses", "error");
      }
    }

    async function activateBusiness(tokenId, btn) {
      const card = btn.closest(".business-card");
      const statusEl = card ? card.querySelector(".status-msg") : null;
      const keyBox = card ? card.querySelector(".key-box") : null;
      const businessAccount = "business-" + tokenId + "." + CONTRACT_ID;

      try {
        btn.disabled = true;
        btn.innerText = "Confirm in wallet...";
        if (statusEl) {
          statusEl.className = "status-msg info";
          statusEl.innerText = "Creating treasury + Agent Function-Call key... Confirm in your wallet";
        }

        const { privateKeyStr, publicKeyStr } = generateKeyPair();

        if (keyBox) {
          keyBox.className = "key-box show";
          keyBox.innerHTML = `
            <div style="color:#4ade80;margin-bottom:6px;font-weight:600;">🔑 Agent Function-Call Key (COPY THIS NOW)</div>
            <div style="user-select:all;word-break:break-all;">${privateKeyStr}</div>
            <div class="warning">
              ⚠️ This is the agent key for this business.<br>
              Copy and store it safely. This is the only time it will be shown.<br>
              You will give this key to your AI agent later.
            </div>
          `;
        }

        const wallet = await connector.wallet();
        await wallet.signAndSendTransaction({
          receiverId: businessAccount,
          actions: [
            { type: "CreateAccount" },
            {
              type: "AddKey",
              params: {
                publicKey: publicKeyStr,
                accessKey: {
                  nonce: 0,
                  permission: {
                    receiverId: businessAccount,
                    methodNames: [],
                    allowance: "250000000000000000000000"
                  }
                }
              }
            },
            { type: "Transfer", params: { deposit: "100000000000000000000000" } }
          ]
        });

        // OutLayer addition (only after success)
        const outlayer = await registerOutlayerWallet();
        if (outlayer && outlayer.api_key && keyBox) {
          keyBox.innerHTML += `
            <div style="margin-top:14px;border-top:1px solid #3f3f46;padding-top:12px;">
              <div style="color:#c084fc;margin-bottom:6px;font-weight:600;">🛡️ OutLayer TEE API Key</div>
              <div style="user-select:all;word-break:break-all;">${outlayer.api_key}</div>
              <div class="warning" style="margin-top:8px;">Copy this key too. Paste it in Agent Control tab later.</div>
            </div>
          `;
        }

        if (statusEl) {
          statusEl.className = "status-msg success";
          statusEl.innerText = "✅ Business activated! Agent key has been added.";
        }
        btn.innerText = "Activated ✓";
        showToast("Agent key granted successfully! Copy the private key now.", "success");

        setTimeout(() => {
          loadBusinesses();
        }, 60000);
      } catch (err) {
        if (statusEl) {
          statusEl.className = "status-msg error";
          statusEl.innerText = err.message || "Activation failed or cancelled";
        }
        showToast(err.message || "Activation failed", "error");
        btn.disabled = false;
        btn.innerText = "Activate Business";
      }
    }

    // ========== AGENT CONTROL FUNCTIONS ==========
    window.checkAgentBalance = async function() {
      const account = document.getElementById("agentBusinessAccount").value.trim();
      const resultEl = document.getElementById("agentResult");

      if (!account) {
        showToast("Please enter the Business Account", "error");
        return;
      }

      resultEl.style.display = "block";
      resultEl.innerText = "Checking balance...";

      const balance = await getAccountBalance(account);
      if (balance !== null) {
        resultEl.innerText = `Treasury Balance of \( {account}:\n\n \){balance} NEAR\n\n✅ Account exists and is controlled by the Function-Call key.`;
      } else {
        resultEl.innerText = `Could not find account or failed to fetch balance.\nMake sure the account name is correct.`;
      }
    };

   window.checkOutlayerBalance = async function() {
  const apiKey = document.getElementById("outlayerApiKey").value.trim();
  const resultEl = document.getElementById("agentResult");

  if (!apiKey) {
    showToast("Please paste an OutLayer API key (wk_...)", "error");
    return;
  }

  if (!apiKey.startsWith("wk_")) {
    showToast("Key must start with wk_", "error");
    return;
  }

  resultEl.style.display = "block";
  resultEl.innerText = "Checking OutLayer balance...";

  try {
    const res = await fetch("https://testnet-api.outlayer.ai/wallet/v1/balance?chain=near", {
      method: "GET",
      headers: {
        "Authorization": "Bearer " + apiKey,
        "Accept": "application/json"
      }
    });

    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      data = text;
    }

    if (!res.ok) {
      let message = "OutLayer Error " + res.status + "\n\n";
      if (typeof data === "string") {
        message += data;
      } else {
        message += JSON.stringify(data, null, 2);
      }
      message += "\n\nPossible reasons:\n• Key is a trial key that needs claiming\n• Key was not fully registered\n• Testnet key expired or invalid";
      resultEl.innerText = message;
      return;
    }

    resultEl.innerText = "✅ OutLayer Balance:\n\n" + JSON.stringify(data, null, 2);
  } catch (err) {
    resultEl.innerText = "Network / CORS error:\n" + err.message;
  }
};
