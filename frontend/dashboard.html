<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Owner Dashboard – Autonomous</title>
  <style>
    :root {
      --sidebar: #163226; --sidebar-active: #25513b; --bg: #f4f6f3; --card: #ffffff; --border: #e2e8e1;
      --ink: #15271f; --muted: #66756c; --green: #23744c; --green-soft: #e8f3e6; --hero: #173f2e;
      --lime: #cdeeaa; --danger: #c0392b; --amber: #9a7208; --amber-soft: #fbf1d6; --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; min-height: 100vh; }
    button { font-family: inherit; }
    a { color: inherit; }

    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; flex-shrink: 0; background: var(--sidebar); color: #e6efe9; position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; padding: 24px 20px; z-index: 50; transition: transform .25s ease; }
    .brand { font-size: 1.55rem; font-weight: 600; letter-spacing: -0.02em; color: #fff; }
    .brand-sub { font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: #a9c1b3; margin-top: 4px; }
    .nav { margin-top: 48px; display: flex; flex-direction: column; gap: 6px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #cfe0d5; font-size: .92rem; cursor: pointer; border: none; background: none; text-align: left; width: 100%; }
    .nav-item:hover { background: rgba(255,255,255,.06); }
    .nav-item.active { background: var(--sidebar-active); color: #fff; font-weight: 600; }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar-foot { margin-top: auto; }
    .sys-box { background: rgba(255,255,255,.06); border-radius: 10px; padding: 12px; font-size: .7rem; color: #a9c1b3; }
    .sys-box .ok { color: #e6efe9; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-weight: 500; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); display: inline-block; }
    .foot-note { margin-top: 14px; font-size: .68rem; color: #86a393; }

    .main { margin-left: 220px; flex: 1; min-width: 0; }
    .topbar { background: #fff; height: 80px; padding: 0 36px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .crumbs { font-size: .82rem; color: var(--muted); }
    .crumbs b { color: var(--ink); font-weight: 500; }
    .crumbs span.sep { margin: 0 10px; opacity: .6; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .pill { background: var(--bg); border-radius: 10px; padding: 8px 14px; font-size: .8rem; display: flex; align-items: center; gap: 8px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill .dot { background: var(--sidebar); }
    .menu-btn { display: none; background: none; border: none; cursor: pointer; padding: 4px; color: var(--ink); }
    .menu-btn svg { width: 24px; height: 24px; }
    .mobile-brand { display: none; font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }

    .content { padding: 36px; max-width: 1200px; }
    .eyebrow { font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
    h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
    .page-sub { color: var(--muted); font-size: .92rem; margin-top: 10px; }
    .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .meta-line { font-size: .78rem; color: var(--muted); margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
    .meta-line a { color: var(--green); text-decoration: none; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .card h3 { font-size: 1.02rem; font-weight: 600; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
    .card-head .num { font-size: .72rem; color: var(--muted); }
    .card-sub { color: var(--muted); font-size: .82rem; margin-bottom: 14px; }
    .hint { color: var(--muted); font-size: .74rem; margin-top: 8px; }
    .label-sm { font-size: .8rem; color: var(--muted); }
    .big { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; margin: 6px 0 4px; }
    .big.green { color: var(--green); }
    .stack { display: flex; flex-direction: column; gap: 16px; }

    .btn { border: 1px solid transparent; border-radius: 10px; padding: 11px 18px; font-size: .88rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-lime { background: var(--lime); color: var(--hero); }
    .btn-ghost { background: #fff; border-color: var(--border); color: var(--ink); }
    .btn-danger { background: #fff; border-color: #e8b4ad; color: var(--danger); }
    .btn-block { width: 100%; }
    .btn-sm { padding: 7px 12px; font-size: .78rem; }

    .badge { display: inline-flex; align-items: center; gap: 7px; background: var(--green-soft); color: var(--green); font-size: .74rem; font-weight: 600; padding: 5px 11px; border-radius: 8px; }
    .badge.pending { background: var(--amber-soft); color: var(--amber); }
    .badge.red { background: #fbe4e1; color: var(--danger); }
    .badge .dot { background: currentColor; width: 6px; height: 6px; }
    .tag { font-size: .66rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

    .stat-grid { display: grid; gap: 16px; margin-bottom: 20px; }
    .stat-grid.c4 { grid-template-columns: repeat(4, 1fr); }
    .stat-grid.c3 { grid-template-columns: repeat(3, 1fr); }
    .stat .big { font-size: 1.9rem; }

    .hero { background: var(--hero); color: #fff; border-radius: var(--radius); padding: 26px; display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .hero .tag { color: #a9c9b5; }
    .hero .amount { font-size: 2.6rem; font-weight: 600; color: var(--lime); letter-spacing: -0.02em; line-height: 1.1; margin-top: 8px; }
    .hero .amount small { font-size: .85rem; color: #cfe3d6; font-weight: 400; margin-left: 8px; }
    .hero .from { margin: 14px 0; font-size: .85rem; color: #dcebe1; }

    .status-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .status-grid .v { font-size: 1.05rem; font-weight: 500; margin-top: 4px; }
    .status-grid .v.green { color: var(--green); }

    .table-head, .row { display: grid; grid-template-columns: 1fr 110px 130px; gap: 12px; align-items: center; }
    .table-head { font-size: .66rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; }
    .row { padding: 14px 0; border-top: 1px solid var(--border); }
    .row .t { font-weight: 500; font-size: .9rem; }
    .row .s { font-size: .78rem; color: var(--muted); word-break: break-word; }
    .row .amt { text-align: right; font-weight: 600; color: var(--green); }
    .row .amt small { display: block; font-weight: 400; color: var(--muted); font-size: .72rem; }
    .empty { text-align: center; color: var(--muted); font-size: .88rem; padding: 26px 0; }
    pre.result { background: var(--bg); border-radius: 10px; padding: 12px; font-size: .78rem; white-space: pre-wrap; word-break: break-word; margin-top: 8px; font-family: inherit; }

    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab { background: transparent; border: none; border-radius: 8px; padding: 6px 12px; font-size: .8rem; color: var(--muted); cursor: pointer; }
    .tab.active { background: var(--green-soft); color: var(--green); }

    .biz-card { margin-bottom: 20px; }
    .biz-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
    .biz-card h2 { font-size: 1.6rem; font-weight: 600; margin: 10px 0 8px; letter-spacing: -0.01em; }
    .biz-card p.desc { color: var(--muted); font-size: .88rem; margin-bottom: 16px; }
    .mini-stats { background: var(--bg); border-radius: 12px; padding: 16px 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .mini-stats .v { font-size: 1.2rem; font-weight: 600; margin-top: 2px; }
    .mini-stats .v.green { color: var(--green); }
    .biz-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: .78rem; flex-wrap: wrap; gap: 8px; }
    .biz-foot a { color: var(--green); text-decoration: none; word-break: break-all; }
    .biz-foot .healthy { color: var(--green); display: flex; align-items: center; gap: 7px; }
    .biz-foot .healthy.warn { color: var(--amber); }
    .cta-band { background: #ebf3e8; border-radius: var(--radius); padding: 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .cta-band h3 { font-size: 1.1rem; font-weight: 600; }
    .cta-band p { color: var(--muted); font-size: .85rem; margin-top: 6px; }

    .two-col { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 18px; align-items: start; }
    .biz-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 0; }
    .biz-row .amt { color: var(--green); font-size: 1.1rem; font-weight: 600; }
    .steps { list-style: none; display: flex; flex-direction: column; gap: 16px; }
    .steps li { display: grid; grid-template-columns: 26px 1fr; gap: 6px; font-size: .86rem; }
    .steps li .n { color: var(--green); font-size: .74rem; font-weight: 600; padding-top: 2px; }
    .steps li .d { color: var(--muted); font-size: .78rem; }
    .kv { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 14px; gap: 10px; }
    .kv b { color: var(--ink); font-weight: 500; text-align: right; }

    .banner { background: var(--green-soft); color: var(--green); border-radius: 10px; padding: 14px 18px; font-size: .85rem; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
    .banner .dot { background: var(--green); flex-shrink: 0; }
    .banner.warn { background: var(--amber-soft); color: var(--amber); }
    .banner.warn .dot { background: var(--amber); }
    .cfg-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .8rem; font-weight: 500; margin-bottom: 6px; }
    .input, textarea.input { width: 100%; background: #fafbf9; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: .88rem; color: var(--ink); font-family: inherit; }
    textarea.input { min-height: 84px; resize: vertical; }
    textarea.mono { font-family: ui-monospace, Menlo, monospace; font-size: .76rem; }
    .input:focus { outline: 2px solid rgba(35,116,76,.25); border-color: var(--green); }
    .input[readonly] { color: var(--muted); }
    .two-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .alloc-bar { display: flex; gap: 4px; margin-bottom: 18px; }
    .alloc-bar i { height: 10px; border-radius: 4px; display: block; }
    .alloc-bar i:first-child { background: var(--green); }
    .alloc-bar i:last-child { background: #b9e08d; }
    .alloc-total { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: var(--muted); }
    .foot-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 12px; flex-wrap: wrap; }
    .foot-actions .btns { display: flex; gap: 10px; }
    .payee { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: .82rem; word-break: break-all; }

    .status-msg { font-size: .82rem; padding: 10px 12px; border-radius: 10px; margin-top: 12px; }
    .status-msg.error { background: #fbe4e1; color: var(--danger); }
    .status-msg.success { background: var(--green-soft); color: var(--green); }
    .status-msg.info { background: #e3edf9; color: #2b5fa3; }
    .key-box { background: #0f1f18; color: #d9efe0; border-radius: 12px; padding: 14px; margin-top: 14px; font-family: ui-monospace, Menlo, monospace; font-size: .72rem; word-break: break-all; }
    .key-box .k-title { font-family: inherit; font-weight: 600; margin-bottom: 6px; color: var(--lime); font-size: .78rem; }
    .key-box .k-val { user-select: all; }
    .key-box .k-warn { font-family: inherit; background: rgba(234,179,8,.14); color: #f2cf5a; padding: 10px; border-radius: 8px; margin-top: 8px; font-size: .74rem; line-height: 1.45; }
    .key-box hr { border: none; border-top: 1px solid rgba(255,255,255,.12); margin: 14px 0; }
    .info-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 14px; font-size: .82rem; white-space: pre-wrap; display: none; }
    .info-panel.show { display: block; }
    .result-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 14px; font-size: .82rem; white-space: pre-wrap; display: none; word-break: break-word; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

    #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid var(--border); color: var(--ink); padding: 12px 18px; border-radius: 12px; font-size: .88rem; max-width: 90%; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity .3s; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    #toast.show { opacity: 1; }
    #toast.error { border-color: var(--danger); color: var(--danger); }
    #toast.success { border-color: var(--green); color: var(--green); }

    .bottom-nav { display: none; }
    .scrim { display: none; }
    .mobile-only { display: none !important; }

    @media (max-width: 1100px) {
      .stat-grid.c4 { grid-template-columns: repeat(2, 1fr); }
      .two-col, .cfg-grid { grid-template-columns: 1fr; }
      .status-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 860px) {
      .sidebar { transform: translateX(-100%); box-shadow: 8px 0 30px rgba(0,0,0,.25); }
      body.menu-open .sidebar { transform: translateX(0); }
      body.menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
      .main { margin-left: 0; }
      .topbar { height: 64px; padding: 0 20px; }
      .crumbs, .top-actions .pill { display: none; }
      .mobile-brand { display: block; }
      .menu-btn { display: block; }
      .content { padding: 22px 18px 110px; }
      h1 { font-size: 1.8rem; }
      .page-head { flex-direction: column; }
      .page-head .btn { display: none; }
      .page-head .btn.keep { display: inline-flex; }
      .stat-grid.c4 { grid-template-columns: 1fr 1fr; }
      .stat-grid.c3 { grid-template-columns: 1fr; }
      .hero { flex-direction: column; align-items: stretch; }
      .hero .btn { width: 100%; }
      .status-grid { grid-template-columns: 1fr; gap: 12px; }
      .status-grid > div { display: flex; justify-content: space-between; align-items: center; }
      .status-grid .v { margin: 0; font-size: 1rem; }
      .table-head { display: none; }
      .row { grid-template-columns: 1fr auto; }
      .mini-stats { grid-template-columns: 1fr; }
      .mini-stats > div { display: flex; justify-content: space-between; align-items: center; }
      .biz-top .btn { display: none; }
      .cta-band { flex-direction: column; align-items: stretch; }
      .cta-band .btn { width: 100%; }
      .two-inputs { grid-template-columns: 1fr; }
      .foot-actions { flex-direction: column-reverse; align-items: stretch; }
      .foot-actions .btns { flex-direction: column-reverse; }
      .foot-actions .btn { width: 100%; }
      .mobile-only { display: inline-flex !important; }
      .bottom-nav { display: flex; position: fixed; left: 16px; right: 16px; bottom: 14px; background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 6px; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.08); }
      .bottom-nav button { flex: 1; background: none; border: none; padding: 12px 4px; font-size: .86rem; color: var(--muted); cursor: pointer; border-radius: 12px; }
      .bottom-nav button.active { color: var(--green); font-weight: 600; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div>
        <div class="brand">autonomous</div>
        <div class="brand-sub">Businesses on NEAR</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="sys-box">
          <div class="ok"><span class="dot"></span> Live on testnet</div>
          <div>NEAR Protocol · Testnet</div>
        </div>
        <div class="foot-note">Autonomous by design.</div>
      </div>
    </aside>
    <div class="scrim" data-action="close-menu"></div>

    <div class="main">
      <header class="topbar">
        <div class="mobile-brand">autonomous</div>
        <div class="crumbs" id="crumbs"></div>
        <div class="top-actions">
          <div class="pill"><span class="dot"></span> NEAR Protocol</div>
          <div class="pill" id="ownerPill">Not connected</div>
          <button class="menu-btn" data-action="toggle-menu" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl.min.js"></script>
  <script type="importmap">
  { "imports": { "@hot-labs/near-connect": "https://esm.sh/@hot-labs/near-connect@0.12.0" } }
  </script>

  <script type="module">
    import { NearConnector } from "@hot-labs/near-connect";

    /* =====================================================================
       CONFIG
       ===================================================================== */
    const CONTRACT_ID = "buildingfromthetop.testnet";
    const NETWORK = "testnet";
    const RPC_URL = "https://rpc.testnet.near.org";
    const OUTLAYER_API = "https://testnet-api.outlayer.ai";
    const STORAGE_RESERVE_NEAR = 0.005;
    const MARKETPLACE_URL = "https://market.near.ai";
    // After you run list-on-market.mjs, put your registered handle here, e.g. "business_19"
    const MARKET_AGENT_HANDLE = "";

    const CLAIM_GAS = "80000000000000";       // 80 Tgas
    const OWNER_GAS = "80000000000000";       // 80 Tgas (owner checks go through the NFT contract)
    const ACTIVATE_GAS = "250000000000000";   // 250 Tgas
    const ROTATE_GAS = "60000000000000";      // 60 Tgas
    const ORDER_GAS = "30000000000000";       // 30 Tgas
    const CANCEL_GAS = "30000000000000";      // 30 Tgas
    const ACTIVATION_MARGIN_YOCTO = 50000000000000000000000n; // +0.05 NEAR on top of the contract's quoted cost
    const ONLINE_WINDOW_MS = 30 * 60 * 1000;  // agent counts as online if its last heartbeat is newer than this

    /* =====================================================================
       STATE
       ===================================================================== */
    let connector = null;
    const state = {
      accountId: null,
      walletBalance: null,
      businesses: [],
      selectedId: null,
      loading: false,
      loaded: false,
      loadError: false,
      view: "overview",
      filter: "all",
      search: "",
      keys: {},
      status: {},
      transferOpen: {},
      orderAccount: null,
      order: { stats: null, jobs: [], loading: false, error: false }
    };

    /* =====================================================================
       HELPERS
       ===================================================================== */
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const shortAcct = (a) => (a && a.length > 22 ? a.slice(0, 10) + "…" + a.slice(-8) : a);
    const businessAccountFor = (tokenId) => "business-" + tokenId + "." + CONTRACT_ID;
    const E24 = 10n ** 24n;

    function fmtYocto(y, decimals = 4) {
      try {
        const n = BigInt(y);
        const unit = 10n ** BigInt(24 - decimals);
        const whole = n / E24;
        const frac = (n % E24) / unit;
        return `${whole}.${String(frac).padStart(decimals, "0")}`;
      } catch (e) { return "0.0000"; }
    }
    function nearToYocto(str) {
      const s = String(str).trim();
      if (!/^\d+(\.\d+)?$/.test(s)) throw new Error("Enter a valid NEAR amount");
      const [w, f = ""] = s.split(".");
      return (BigInt(w) * E24 + BigInt((f + "0".repeat(24)).slice(0, 24))).toString();
    }
    const fmtNear = (v) => (v === null || v === undefined ? "—" : v + " Ⓝ");
    function nsToMs(ns) { try { return Number(BigInt(ns) / 1000000n); } catch (e) { return 0; } }
    function ago(ms) {
      if (!ms) return "never";
      const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
      if (s < 60) return s + "s ago";
      if (s < 3600) return Math.floor(s / 60) + " min ago";
      if (s < 86400) return Math.floor(s / 3600) + " hrs ago";
      return Math.floor(s / 86400) + " days ago";
    }

    function showToast(message, type = "info") {
      const el = $("toast");
      el.textContent = message;
      el.className = "show " + type;
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.className = ""; }, 4500);
    }

    const ICONS = {

    /* =====================================================================
       NEAR / CRYPTO UTILITIES
       ===================================================================== */
    function toBase58(bytes) {
      const ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
      let num = BigInt(0);
      for (let i = 0; i < bytes.length; i++) num = (num << 8n) + BigInt(bytes[i]);
      let str = "";
      while (num > 0n) { str = ALPHABET[Number(num % 58n)] + str; num = num / 58n; }
      for (let i = 0; i < bytes.length && bytes[i] === 0; i++) str = "1" + str;
      return str;
    }
    function generateKeyPair() {
      if (typeof nacl === "undefined") throw new Error("Crypto library not loaded. Please refresh.");
      const kp = nacl.sign.keyPair();
      const seed = kp.secretKey.slice(0, 32);
      return { privateKeyStr: "ed25519:" + toBase58(seed), publicKeyStr: "ed25519:" + toBase58(kp.publicKey) };
    }

    async function rpc(params) {
      const res = await fetch(RPC_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: "1", method: "query", params })
      });
      return res.json();
    }

    // Read-only contract call. Returns parsed JSON, or null if the method does not exist / fails.
    async function rpcView(contractId, method, args = {}) {
      try {
        const data = await rpc({
          request_type: "call_function", finality: "final", account_id: contractId,
          method_name: method, args_base64: btoa(JSON.stringify(args))
        });
        const bytes = data.result?.result;
        if (!bytes) return null;
        return JSON.parse(new TextDecoder().decode(new Uint8Array(bytes)));
      } catch (e) { return null; }
    }

    async function getAccountInfo(accountId) {
      try {
        const data = await rpc({ request_type: "view_account", finality: "final", account_id: accountId });
        if (!data.result || !data.result.amount) return null;
        const total = BigInt(data.result.amount);
        const locked = BigInt(data.result.storage_usage || 0) * 10n ** 19n;
        const free = total > locked ? total - locked : 0n;
        return {
          balance: (Number(total) / 1e24).toFixed(4),
          claimable: Math.max(0, Number(free) / 1e24 - STORAGE_RESERVE_NEAR)
        };
      } catch (e) { return null; }
    }
    async function getAccountBalance(accountId) {
      const info = await getAccountInfo(accountId);
      return info ? info.balance : null;
    }

        return await res.json();
      } catch (e) { return null; }
    }

    async function sendCall(receiverId, methodName, args, gas, deposit = "0") {
      const wallet = await connector.wallet();
      return wallet.signAndSendTransaction({
        receiverId,
        actions: [{ type: "FunctionCall", params: { methodName, args, gas, deposit } }]
      });

    async function loadOneBusiness(token) {
      const tokenId = String(token.token_id);
      const account = businessAccountFor(tokenId);
      const info = await getAccountInfo(account);
      const biz = {
        tokenId, account,
        title: token.metadata?.title || "Untitled",
        description: token.metadata?.description || "No description",
        balance: info ? info.balance : null,
        active: !!info,
        stats: null, jobs: [], claimYocto: 0n
      };
      if (info) {
        const stats = await rpcView(account, "get_stats");
        if (stats) {
          biz.stats = stats;
          biz.jobs = (await rpcView(account, "get_recent_jobs", { limit: 30 })) || [];
          biz.claimYocto = BigInt(stats.owner_available);
        } else {
          // first-version treasury without on-chain settings
          biz.claimYocto = BigInt(Math.floor(info.claimable * 1e4)) * 10n ** 20n;
        }
      }
      return biz;
    }

    async function loadBusinesses() {
      if (!state.accountId) return;
      state.loading = true; state.loadError = false; render();

        const tokens = await rpcView(CONTRACT_ID, "nft_tokens_for_owner", { account_id: state.accountId });
        if (tokens === null) throw new Error("load failed");
        state.businesses = await Promise.all(tokens.map(loadOneBusiness));
        if (!state.businesses.find(b => b.tokenId === state.selectedId)) state.selectedId = state.businesses[0]?.tokenId || null;
        state.loaded = true;
      } catch (err) {
        state.loadError = true;
        showToast("Failed to load businesses", "error");

      state.loading = false;
      render();
    }

      const jobs = (await rpcView(account, "get_recent_jobs", { limit: 30 })) || [];
      state.order = { stats, jobs, loading: false, error: false };
      if (state.view === "order") render();

    function agentStatus(b) {
      if (!b.active) return { label: "Pending activation", cls: "pending", detail: "Activate to start the agent" };
      if (!b.stats) return { label: "Treasury v1", cls: "pending", detail: "No on-chain agent features" };
      const lastMs = nsToMs(b.stats.last_heartbeat_ns);
      if (b.stats.paused) return { label: "Paused", cls: "pending", detail: lastMs ? "Agent last seen " + ago(lastMs) : "Agent not seen yet" };
      if (!lastMs) return { label: "Waiting for agent", cls: "pending", detail: "No heartbeat yet. Start the worker." };
      if (Date.now() - lastMs < ONLINE_WINDOW_MS) return { label: "Agent online", cls: "", detail: "Last heartbeat " + ago(lastMs) };
      return { label: "Agent offline", cls: "red", detail: "Last heartbeat " + ago(lastMs) };
    }
    function revenue30d(b) {
      const cutoff = Date.now() - 30 * 86400 * 1000;
      return (b.jobs || []).filter(j => j.status === "done" && nsToMs(j.done_ns) >= cutoff).reduce((s, j) => s + BigInt(j.paid), 0n);
    }
    function successRate(b) {
      if (!b.stats) return null;
      const done = b.stats.jobs_done, ref = b.stats.jobs_refunded;
      return done + ref === 0 ? null : ((done / (done + ref)) * 100).toFixed(1) + "%";
    }

    async function activateBusiness(tokenId, btn) {
      try {
        btn.disabled = true; btn.textContent = "Confirm in wallet...";
        setStatus(tokenId, "info", "Creating treasury + restricted agent key... Confirm in your wallet");

        const quoted = await rpcView(CONTRACT_ID, "activation_cost");
        if (!quoted) throw new Error("Could not read the activation cost. Has the treasury code been uploaded?");
        const deposit = (BigInt(quoted) + ACTIVATION_MARGIN_YOCTO).toString();

        const { privateKeyStr, publicKeyStr } = generateKeyPair();
        state.keys[tokenId] = { privateKey: privateKeyStr, outlayerKey: null };
        refreshKeyBox(tokenId);

        await sendCall(CONTRACT_ID, "activate_business", { token_id: tokenId, agent_public_key: publicKeyStr }, ACTIVATE_GAS, deposit);

        const outlayer = await registerOutlayerWallet();
        if (outlayer && outlayer.api_key) { state.keys[tokenId].outlayerKey = outlayer.api_key; refreshKeyBox(tokenId); }

        setStatus(tokenId, "success", "✅ Business activated! Copy the agent key now.");
        btn.textContent = "Activated ✓";
        showToast("Business activated. Copy the agent key now.", "success");
        setTimeout(() => loadBusinesses(), 15000);
      } catch (err) {
        setStatus(tokenId, "error", err.message || "Activation failed or cancelled");
        showToast(err.message || "Activation failed", "error");
        btn.disabled = false; btn.textContent = "Activate business";
      }
    }

    async function claimRevenue(tokenId, btn) {
      const biz = state.businesses.find(b => b.tokenId === tokenId);
      if (!biz) return showToast("Business account not found", "error");
      const original = btn.textContent;
      try {
        btn.disabled = true; btn.textContent = "Claiming...";
        setStatus(tokenId, "info", "Preparing claim... Confirm in your wallet");
        if (biz.claimYocto < 1000000000000000000000n) throw new Error("Nothing to claim yet (need at least 0.001 NEAR of owner share)");

        // The treasury contract checks you hold the NFT and only releases your enforced share
        await sendCall(biz.account, "claim", { amount: biz.claimYocto.toString() }, CLAIM_GAS);

        setStatus(tokenId, "success", `✅ Claimed ${fmtYocto(biz.claimYocto)} NEAR to your wallet`);
        showToast("Revenue claimed successfully", "success");
        setTimeout(() => loadBusinesses(), 5000);
      } catch (err) {
        setStatus(tokenId, "error", err.message || "Claim failed or cancelled");
        showToast(err.message || "Claim failed", "error");
        btn.disabled = false; btn.textContent = original;
      }
    }

        await sendCall(CONTRACT_ID, "rotate_agent_key", { token_id: tokenId, agent_public_key: publicKeyStr }, ROTATE_GAS);
        state.keys[tokenId] = { ...(state.keys[tokenId] || {}), privateKey: privateKeyStr };

        showToast("New agent key created. Copy it, then resume the business if it is paused.", "success");

      if (!apiKey.startsWith("wk_")) return showToast("Key must start with wk_", "error");
      setPanel("agentResult", "Checking OutLayer balance...");

        });
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch (e) { data = text; }
        if (!res.ok) {
          let message = "OutLayer Error " + res.status + "\n\n" + (typeof data === "string" ? data : JSON.stringify(data, null, 2));

    /* =====================================================================
       VIEW: Wallet
       ===================================================================== */
    function viewWallet() {
      const connected = !!state.accountId;
      const claimTotal = totalClaimYocto();
      const claimBiz = state.businesses.find(b => b.active && b.claimYocto >= 1000000000000000000000n) || null;
      const heroBtn = connected
        ? `<button class="btn btn-lime" data-action="claim" data-id="${esc(claimBiz?.tokenId || "")}" ${claimBiz ? "" : "disabled"}>Claim to wallet →</button>`
        : `<button class="btn btn-lime" data-action="connect">Connect to claim →</button>`;
      const v2 = state.businesses.filter(b => b.stats);
      const earned = v2.reduce((s, b) => s + BigInt(b.stats.earned_total), 0n);
      const allJobs = v2.flatMap(b => b.jobs.filter(j => j.status === "done").map(j => ({ ...j, bps: b.stats.owner_bps, title: b.title })))
        .sort((a, c) => nsToMs(c.done_ns) - nsToMs(a.done_ns)).slice(0, 6);

      return `
        <div class="eyebrow">Your earnings</div>
        <div class="page-head">
          <div><h1>Wallet</h1><div class="page-sub">Manage and claim profits from your autonomous businesses.</div></div>
          ${connected ? `<button class="btn btn-primary" data-action="disconnect">Disconnect wallet</button>` : `<button class="btn btn-primary" data-action="connect">Connect wallet</button>`}
        </div>

        <div class="two-col">
          <div class="stack">
            <div class="hero" style="flex-direction:column;align-items:stretch;margin:0">
              <div>
                <div class="tag">Available to claim</div>
                <div class="amount">${fmtYocto(claimTotal)}<small>NEAR</small></div>
              </div>
              <div class="from">${claimBiz ? "From " + esc(claimBiz.title) + " #" + esc(claimBiz.tokenId) : "No claimable profits yet"}</div>
              <div>${heroBtn}</div>
              ${claimBiz ? `<div class="status-msg ${esc(state.status[claimBiz.tokenId]?.cls || "")}" id="status-${esc(claimBiz.tokenId)}" style="display:${state.status[claimBiz.tokenId] ? "block" : "none"}">${esc(state.status[claimBiz.tokenId]?.msg || "")}</div>` : ""}
            </div>

            <div class="card">
              <div class="card-head"><h3>Claimable by business</h3><span class="badge">${state.businesses.filter(b => b.active).length} business</span></div>
              ${state.businesses.filter(b => b.active).map(b => `
                <div style="margin-bottom:14px">
                  <div class="biz-row"><div><div style="font-weight:600">${esc(b.title)} #${esc(b.tokenId)}</div><div class="label-sm" style="font-size:.72rem">${esc(b.account)}</div></div>
                  <div class="amt">${fmtYocto(b.claimYocto)} Ⓝ</div></div>
                  ${b.stats ? `<div class="label-sm" style="font-size:.74rem;margin-top:6px">${(b.stats.owner_bps / 100).toFixed(0)}% to owner · ${(100 - b.stats.owner_bps / 100).toFixed(0)}% reinvested (enforced on-chain)</div>` : ""}
                </div>`).join("") || `<div class="empty">${connected ? "No active businesses." : "Connect your wallet to see claimable profits."}</div>`}
            </div>

            <div class="card">
              <div class="card-head"><h3>Recent payouts</h3></div>
              <div class="card-sub">Completed customer jobs and your share at the current split.</div>
              ${allJobs.length ? allJobs.map(j => `<div class="row" style="grid-template-columns:1fr auto">
                <div><div class="t">${esc(j.title)} · job #${esc(j.id)}</div><div class="s">${ago(nsToMs(j.done_ns))}</div></div>
                <div class="amt">${fmtYocto((BigInt(j.paid) * BigInt(j.bps)) / 10000n)} Ⓝ<small>to owner</small></div></div>`).join("") : `<div class="empty" style="border-top:1px solid var(--border)">No payouts yet.</div>`}
            </div>
          </div>

          <div class="stack">
            <div class="card"><div class="label-sm">Business net earnings</div><div class="big green">${v2.length ? fmtYocto(earned) + " Ⓝ" : "—"}</div><div class="label-sm" style="font-size:.74rem">All time · before profit distribution</div></div>
            <div class="card"><div class="label-sm">Agent treasury</div><div class="big">${totalTreasuryNear().toFixed(4)} Ⓝ</div><div class="label-sm" style="font-size:.74rem">Held by the business, separate from your wallet</div></div>

            <div class="card">
              <div class="card-head"><h3>Your wallet</h3><span class="label-sm" style="font-size:.7rem">${connected ? "Connected" : "Not connected"}</span></div>
              ${connected
                ? `<div class="card-sub" style="word-break:break-all">${esc(state.accountId)}</div>
                   <div class="big" style="font-size:1.5rem">${esc(fmtNear(state.walletBalance))}</div>
                   <button class="btn btn-ghost btn-block" data-action="disconnect" style="margin-top:10px">Disconnect wallet</button>`
                : `<div class="card-sub">Connect your NEAR wallet to view its balance and receive your business profits.</div>
                   <button class="btn btn-primary btn-block" data-action="connect">Connect wallet</button>`}
              <div class="kv"><span>Network</span><b>NEAR Protocol</b></div>
            </div>

            <div class="card">
              <div class="card-head"><h3>How claiming works</h3></div>
              <ol class="steps">
                <li><span class="n">01</span><div>Customers pay into escrow<div class="d">The agent delivers, then the contract splits the revenue.</div></div></li>
                <li><span class="n">02</span><div>Your share builds up<div class="d">Only your enforced percentage can be claimed.</div></div></li>
                <li><span class="n">03</span><div>Confirm the transfer<div class="d">Approve the claim in your wallet.</div></div></li>
              </ol>
            </div>
          </div>
        </div>`;
    }

    /* =====================================================================
       VIEW: Public order page (any visitor)
       ===================================================================== */
    function viewOrder() {
      const account = state.orderAccount;
      const o = state.order;
      const st = o.stats;
      const mine = state.accountId ? o.jobs.filter(j => j.customer === state.accountId) : [];
      const now = Date.now();
      return `
        <div class="eyebrow">Autonomous business · customer order page</div>
        <div class="page-head">
          <div><h1>Order a market report</h1>
            <div class="meta-line"><a href="https://explorer.testnet.near.org/accounts/${esc(account)}" target="_blank" rel="noopener">${esc(account)} ↗</a></div>
            <div class="page-sub">An AI agent owned by an NFT delivers your report. Your payment is held in escrow until it delivers.</div></div>
        </div>
        ${o.loading ? `<div class="card empty">Loading...</div>` : o.error || !st ? `<div class="card empty" style="color:var(--danger)">This business was not found or has no on-chain ordering yet.</div>` : `
        <div class="two-col">
          <div class="stack">
            <div class="card">
              <div class="card-head"><h3>Your request</h3><span class="badge">${fmtYocto(st.price, 3)} Ⓝ per report</span></div>
              ${st.paused ? `<div class="banner warn"><span class="dot"></span>This business is paused and not taking orders.</div>` : ""}
              <div class="field"><label>What should the agent research?</label>
                <textarea class="input" id="orderPrompt" maxlength="500" placeholder="e.g. How are crypto markets moving today and what does it mean for NEAR?" ${st.paused ? "disabled" : ""}></textarea>
                <div class="hint">Up to 500 characters. Delivered on-chain, usually within about 10 minutes.</div></div>
              <button class="btn btn-primary btn-block" id="orderBtn" data-action="order" ${st.paused ? "disabled" : ""}>${state.accountId ? "Pay &amp; order" : "Connect wallet to order"}</button>
            </div>

            <div class="card">
              <div class="card-head"><h3>${state.accountId ? "Your orders" : "Latest jobs"}</h3></div>
              ${(state.accountId ? mine : o.jobs.slice(0, 6)).map(j => {
                const canCancel = j.status === "pending" && nsToMs(j.created_ns) + 3600000 <= now;
                return `<div class="row" style="grid-template-columns:1fr auto">
                  <div><div class="t">#${esc(j.id)} · ${esc(j.status === "done" ? "Delivered" : j.status === "refunded" ? "Refunded" : "Waiting for the agent")}</div>

                  ${j.status === "done" ? `<pre class="result">${esc(j.result)}</pre>` : ""}
                  ${j.status === "pending" && state.accountId ? (canCancel ? `<button class="btn btn-danger btn-sm" style="margin-top:8px" data-action="cancel-order" data-id="${esc(j.id)}">Cancel &amp; refund</button>` : `<div class="s" style="margin-top:6px">Refund available if not delivered within 1 hour.</div>`) : ""}</div>
                  <div class="amt">${fmtYocto(j.paid, 3)} Ⓝ</div></div>`;
              }).join("") || `<div class="empty">${state.accountId ? "You have no orders yet." : "No jobs yet."}</div>`}
            </div>
          </div>

          <div class="stack">
            <div class="card">
              <div class="card-head"><h3>Your wallet</h3><span class="label-sm" style="font-size:.7rem">${state.accountId ? "Connected" : "Not connected"}</span></div>
              ${state.accountId ? `<div class="card-sub" style="word-break:break-all">${esc(state.accountId)}</div>` : `<button class="btn btn-primary btn-block" data-action="connect">Connect wallet</button>`}
            </div>
            <div class="card">
              <div class="card-head"><h3>How it works</h3></div>
              <ol class="steps">
                <li><span class="n">01</span><div>Pay into escrow<div class="d">The contract holds your payment.</div></div></li>
                <li><span class="n">02</span><div>The agent delivers<div class="d">It writes your report and completes the job on-chain.</div></div></li>
                <li><span class="n">03</span><div>Revenue is split<div class="d">${(st.owner_bps / 100).toFixed(0)}% to the NFT owner, the rest reinvested. Enforced by the contract.</div></div></li>
              </ol>
              <div class="kv"><span>Jobs delivered</span><b>${st.jobs_done}</b></div>
              <div class="kv"><span>Refund if not delivered</span><b>after 1 hour</b></div>
            </div>
            <a class="btn btn-ghost btn-block" href="#" data-action="goto" data-id="overview">← Owner dashboard</a>
          </div>
        </div>`}`;
    }

    /* =====================================================================
       RENDER
       ===================================================================== */
    const VIEWS = { overview: viewOverview, businesses: viewBusinesses, wallet: viewWallet, config: viewConfig, order: viewOrder };
    const CRUMBS = {
      overview: () => { const b = selected(); return `My businesses<span class="sep">/</span><b>${esc(b ? b.title : "Overview")}</b>`; },
      businesses: () => `Workspace<span class="sep">/</span><b>My businesses</b>`,
      wallet: () => `Workspace<span class="sep">/</span><b>Wallet</b>`,
      config: () => `My businesses<span class="sep">/</span><b>Configuration</b>`,
      order: () => `Customer<span class="sep">/</span><b>Order</b>`
    };

    function render() {
      $("nav").innerHTML = NAV.map(n =>
        `<button class="nav-item ${state.view === n.id ? "active" : ""}" data-action="goto" data-id="${n.id}">${n.icon}${n.label}</button>`).join("");
      $("bottomNav").innerHTML = NAV.map(n =>
        `<button class="${state.view === n.id ? "active" : ""}" data-action="goto" data-id="${n.id}">${n.mobile}</button>`).join("");
      $("crumbs").innerHTML = CRUMBS[state.view]();
      $("ownerPill").textContent = state.accountId ? "Owner · " + shortAcct(state.accountId) : "Not connected";

      // keep what the user is typing when a background refresh re-renders the page
      const keep = {};
      ["orderPrompt", "searchInput", "payeeInput", "withdrawAmt", "cfgPrice", "cfgOwnerPct", "cfgPerCap", "cfgDailyCap"].forEach(id => {
        const el = $(id); if (el) keep[id] = el.value;
      });
      const activeId = document.activeElement && document.activeElement.id;
      $("view").innerHTML = VIEWS[state.view]();
      Object.keys(keep).forEach(id => { const el = $(id); if (el && keep[id] !== "") el.value = keep[id]; });
      if (activeId && $(activeId) && ["orderPrompt", "searchInput", "payeeInput"].includes(activeId)) {
        const el = $(activeId); el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
      }
    }

    /* =====================================================================
       EVENTS
       ===================================================================== */
    document.addEventListener("click", (e) => {
      const el = e.target.closest("[data-action]");
      if (!el) return;
      const action = el.dataset.action, id = el.dataset.id;
      if (el.tagName === "A" && el.getAttribute("href") === "#") e.preventDefault();

      switch (action) {
        case "goto":
          if (location.hash) history.replaceState(null, "", location.pathname + location.search);
          state.view = id; document.body.classList.remove("menu-open"); render(); window.scrollTo(0, 0); break;
        case "toggle-menu": document.body.classList.toggle("menu-open"); break;
        case "close-menu": document.body.classList.remove("menu-open"); break;
        case "connect": connectWallet(); break;
        case "disconnect": disconnectWallet(); break;
        case "reload": loadBusinesses(); break;
        case "filter": state.filter = id; render(); break;
        case "select": state.selectedId = id; state.view = "overview"; render(); window.scrollTo(0, 0); break;
        case "activate": activateBusiness(id, el); break;
        case "claim":
          if (!id) return showToast("Nothing to claim yet", "error");
          if (!state.accountId) return connectWallet();
          claimRevenue(id, el); break;
        case "toggle-transfer":
          state.transferOpen[id] = !state.transferOpen[id];
          document.getElementById("transfer-" + id)?.classList.toggle("show", !!state.transferOpen[id]); break;
        case "rotate-key": { const b = selected(); if (b) rotateAgentKey(b.tokenId, el); break; }
        case "toggle-pause": { const b = selected(); if (b && b.stats) ownerCall(b, "owner_action", { action: { SetPaused: { paused: !b.stats.paused } } }, b.stats.paused ? "Business resumed" : "Business paused"); break; }
        case "add-payee": {
          const b = selected(); const v = ($("payeeInput")?.value || "").trim().toLowerCase();
          if (!v) return showToast("Enter an account name", "error");
          if (b) ownerCall(b, "owner_action", { action: { AddPayee: { account: v } } }, "Payee added"); break; }
        case "remove-payee": { const b = selected(); if (b) ownerCall(b, "owner_action", { action: { RemovePayee: { account: id } } }, "Payee removed"); break; }
        case "withdraw": withdrawCapital(); break;
        case "save-config": saveConfig(); break;
        case "check-treasury": checkAgentBalance(); break;
        case "check-outlayer": checkOutlayerBalance(); break;
        case "toggle-agent-info": toggleAgentInfo(); break;
        case "order": submitOrder(); break;
        case "cancel-order": cancelOrder(id, el); break;
        case "copy-order":
          navigator.clipboard?.writeText(orderLink(id)).then(() => showToast("Order link copied", "success")).catch(() => showToast(orderLink(id)));
          break;
      }
    });

    document.addEventListener("input", (e) => {
      const t = e.target;
      if (t.id === "searchInput") {
        state.search = t.value;
        const list = state.businesses.filter(b => state.filter !== "active" || b.active)
          .filter(b => (b.title + " " + b.account + " " + b.description).toLowerCase().includes(state.search.trim().toLowerCase()));
        $("bizList").innerHTML = list.length ? list.map(bizCard).join("") : `<div class="card empty">No businesses match.</div>`;
      }
      if (t.id === "cfgOwnerPct") {
        const p = Math.max(0, Math.min(100, Number(t.value) || 0));
        $("cfgReinvestPct").value = 100 - p;
        $("barA").style.flex = 100 - p; $("barB").style.flex = p;
      }
    });

    window.addEventListener("hashchange", () => { parseHash(); render(); });
    setInterval(() => { if (state.view === "order") loadOrder(true); }, 12000);

    init();
  </script>
</body>
</html>
