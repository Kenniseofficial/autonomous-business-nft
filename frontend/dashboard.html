<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Owner Dashboard – Autonomous Business NFT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #050508;
      color: #f4f4f5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 440px; margin: 0 auto; padding: 16px 16px 80px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0 20px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .logo-box {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 9px; display: grid; place-items: center;
    }
    .back { color: #a1a1aa; text-decoration: none; font-size: 0.9rem; }
    .header { margin-bottom: 20px; }
    .header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .header .sub { color: #a1a1aa; font-size: 0.9rem; }
    .account-box {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-green { background: #22c55e; color: #000; }
    .btn-red { background: transparent; border: 1px solid #ef4444; color: #ef4444; }
    .btn-outline {
      background: transparent;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .business-card {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .business-card h3 { font-size: 1.15rem; margin-bottom: 6px; }
    .business-card p { color: #a1a1aa; font-size: 0.9rem; margin-bottom: 10px; }
    .token-id { font-size: 0.8rem; color: #71717a; margin-bottom: 8px; }
    .treasury { color: #4ade80; font-size: 0.85rem; word-break: break-all; margin-bottom: 12px; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: #18181b;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .stat .label { font-size: 0.75rem; color: #71717a; }
    .stat .value { font-size: 1.05rem; font-weight: 600; margin-top: 2px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .badge-live { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-pending { background: rgba(234,179,8,0.15); color: #eab308; }
    .status-msg {
      font-size: 0.85rem;
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }
    .status-msg.error { background: rgba(239,68,68,0.15); color: #f87171; display: block; }
    .status-msg.success { background: rgba(34,197,94,0.15); color: #4ade80; display: block; }
    .status-msg.info { background: rgba(59,130,246,0.15); color: #60a5fa; display: block; }
    .key-box {
      background: #0c0c0e;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      font-family: monospace;
      font-size: 0.75rem;
      word-break: break-all;
      display: none;
    }
    .key-box.show { display: block; }
    .warning {
      background: rgba(234,179,8,0.12);
      color: #eab308;
      font-size: 0.8rem;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">
        <div class="logo-box">◆</div>
        <span>Business NFT</span>
      </div>
      <a href="/" class="back">← Mint</a>
    </div>

    <div class="header">
      <h1>Owner Dashboard</h1>
      <div class="sub">Your Autonomous Businesses</div>
    </div>

    <button id="connectBtn" class="btn btn-green">Connect Wallet</button>
    <button id="disconnectBtn" class="btn btn-red" style="display:none;">Disconnect Wallet</button>

    <div id="accountBox" class="account-box" style="display:none;">
      Connected as<br>
      <strong id="accountIdDisplay"></strong>
    </div>

    <div id="list"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "@hot-labs/near-connect": "https://esm.sh/@hot-labs/near-connect@0.12.0",
      "@noble/ed25519": "https://esm.sh/@noble/ed25519@2.1.0"
    }
  }
  </script>

  <script type="module">
    import { NearConnector } from "@hot-labs/near-connect";
    import * as ed from "@noble/ed25519";

    const CONTRACT_ID = "buildingfromthetop.testnet";
    const NETWORK = "testnet";

    let connector = null;
    let accountId = null;

    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const accountBox = document.getElementById("accountBox");
    const accountIdDisplay = document.getElementById("accountIdDisplay");
    const listEl = document.getElementById("list");

    // ========== helpers ==========
    function toBase58(bytes) {
      const ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
      let num = BigInt(0);
      for (const b of bytes) num = (num << 8n) + BigInt(b);
      let str = "";
      while (num > 0n) {
        str = ALPHABET[Number(num % 58n)] + str;
        num = num / 58n;
      }
      for (const b of bytes) {
        if (b === 0) str = "1" + str;
        else break;
      }
      return str;
    }

    async function generateKeyPair() {
      const privateKey = ed.utils.randomPrivateKey();
      const publicKey = await ed.getPublicKeyAsync(privateKey);

      const privateKeyStr = "ed25519:" + toBase58(privateKey);
      const publicKeyStr = "ed25519:" + toBase58(publicKey);

      return { privateKeyStr, publicKeyStr };
    }

    async function getAccountBalance(accountId) {
      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "1",
            method: "query",
            params: {
              request_type: "view_account",
              finality: "final",
              account_id: accountId
            }
          })
        });
        const data = await res.json();
        if (data.result && data.result.amount) {
          return (Number(data.result.amount) / 1e24).toFixed(4);
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    function updateUI() {
      if (accountId) {
        connectBtn.style.display = "none";
        disconnectBtn.style.display = "block";
        accountBox.style.display = "block";
        accountIdDisplay.textContent = accountId;
      } else {
        connectBtn.style.display = "block";
        disconnectBtn.style.display = "none";
        accountBox.style.display = "none";
        listEl.innerHTML = "";
      }
    }

    // ========== wallet ==========
    async function init() {
      connector = new NearConnector({
        network: NETWORK,
        features: { signAndSendTransaction: true },
        autoConnect: true
      });

      connector.on("wallet:signIn", async () => {
        const connected = await connector.getConnectedWallet();
        if (connected?.accounts?.length) {
          accountId = connected.accounts[0].accountId;
          updateUI();
          loadBusinesses();
        }
      });

      connector.on("wallet:signOut", () => {
        accountId = null;
        updateUI();
      });

      // restore session
      await new Promise(r => setTimeout(r, 400));
      try {
        const connected = await connector.getConnectedWallet();
        if (connected?.accounts?.length) {
          accountId = connected.accounts[0].accountId;
          updateUI();
          loadBusinesses();
        }
      } catch (e) {}
    }

    connectBtn.addEventListener("click", async () => {
      try {
        await connector.connect();
      } catch (err) {
        console.error(err);
      }
    });

    disconnectBtn.addEventListener("click", async () => {
      try {
        await connector.disconnect();
        accountId = null;
        updateUI();
      } catch (err) {
        console.error(err);
      }
    });

    // ========== load businesses ==========
    async function loadBusinesses() {
      if (!accountId) return;
      listEl.innerHTML = `<div style="color:#a1a1aa;padding:20px 0;text-align:center;">Loading your businesses...</div>`;

      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "1",
            method: "query",
            params: {
              request_type: "call_function",
              finality: "final",
              account_id: CONTRACT_ID,
              method_name: "nft_tokens_for_owner",
              args_base64: btoa(JSON.stringify({ account_id: accountId }))
            }
          })
        });

        const data = await res.json();
        const bytes = data.result?.result;
        if (!bytes) {
          listEl.innerHTML = `<div style="color:#a1a1aa;padding:20px 0;text-align:center;">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        const tokens = JSON.parse(String.fromCharCode(...bytes));
        if (!tokens || tokens.length === 0) {
          listEl.innerHTML = `<div style="color:#a1a1aa;padding:20px 0;text-align:center;">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        listEl.innerHTML = "";
        for (const token of tokens) {
          const tokenId = token.token_id;
          const businessAccount = "business-" + tokenId + "." + CONTRACT_ID;
          const title = token.metadata?.title || "Untitled";
          const description = token.metadata?.description || "No description";

          const balance = await getAccountBalance(businessAccount);
          const isActive = balance !== null;

          const card = document.createElement("div");
          card.className = "business-card";
          card.innerHTML = `
            <h3>${title}</h3>
            <p>${description}</p>
            <div class="token-id">Token ID: ${tokenId}</div>
            <div class="treasury">Treasury: ${businessAccount}</div>
            <div class="stats">
              <div class="stat">
                <div class="label">Treasury Balance</div>
                <div class="value">${isActive ? balance + " Ⓝ" : "—"}</div>
              </div>
              <div class="stat">
                <div class="label">Status</div>
                <div class="value">${isActive ? "Live" : "Pending"}</div>
              </div>
            </div>
            <div class="badge ${isActive ? "badge-live" : "badge-pending"}">
              ${isActive ? "● Active" : "○ Pending Activation"}
            </div>
            <button class="btn btn-green activate-btn" data-token="${tokenId}" ${isActive ? "disabled" : ""}>
              ${isActive ? "Activated ✓" : "Activate Business"}
            </button>
            <button class="btn btn-outline grant-btn" data-token="\( {tokenId}" data-account=" \){businessAccount}" ${!isActive ? "disabled" : ""}>
              Grant Agent Access (Function-Call Key)
            </button>
            <div class="status-msg" id="status-${tokenId}"></div>
            <div class="key-box" id="keybox-${tokenId}"></div>
          `;
          listEl.appendChild(card);
        }

        // bind buttons
        document.querySelectorAll(".activate-btn").forEach(btn => {
          btn.addEventListener("click", () => activateBusiness(btn.dataset.token, btn));
        });
        document.querySelectorAll(".grant-btn").forEach(btn => {
          btn.addEventListener("click", () => grantAgentAccess(btn.dataset.token, btn.dataset.account, btn));
        });

      } catch (err) {
        console.error(err);
        listEl.innerHTML = `<div style="color:#f87171;padding:20px 0;text-align:center;">Failed to load businesses</div>`;
      }
    }

    // ========== activate ==========
    async function activateBusiness(tokenId, btn) {
      const statusEl = document.getElementById("status-" + tokenId);
      const businessAccount = "business-" + tokenId + "." + CONTRACT_ID;

      try {
        btn.disabled = true;
        btn.innerText = "Confirm in wallet...";
        statusEl.className = "status-msg info";
        statusEl.innerText = "Creating & funding treasury... Confirm in your wallet";

        const wallet = await connector.wallet();
        await wallet.signAndSendTransaction({
          receiverId: businessAccount,
          actions: [
            { type: "CreateAccount" },
            { type: "Transfer", params: { deposit: "100000000000000000000000" } } // 0.1 NEAR
          ]
        });

        statusEl.className = "status-msg success";
        statusEl.innerText = "✅ Business activated! Sub-account created.";
        btn.innerText = "Activated ✓";
        setTimeout(() => loadBusinesses(), 2000);
      } catch (err) {
        console.error(err);
        statusEl.className = "status-msg error";
        statusEl.innerText = err.message || "Activation failed or cancelled";
        btn.disabled = false;
        btn.innerText = "Activate Business";
      }
    }

    // ========== GRANT AGENT ACCESS (FIXED) ==========
    async function grantAgentAccess(tokenId, businessAccount, btn) {
      const statusEl = document.getElementById("status-" + tokenId);
      const keyBox = document.getElementById("keybox-" + tokenId);

      try {
        btn.disabled = true;
        btn.innerText = "Generating key...";
        statusEl.className = "status-msg info";
        statusEl.innerText = "Generating new Function-Call key...";

        // 1. Generate brand new keypair
        const { privateKeyStr, publicKeyStr } = await generateKeyPair();

        // 2. Show private key to user (IMPORTANT)
        keyBox.className = "key-box show";
        keyBox.innerHTML = `
          <div style="color:#4ade80;margin-bottom:6px;font-weight:600;">🔑 Agent Private Key (copy this now!)</div>
          <div>${privateKeyStr}</div>
          <div class="warning">
            ⚠️ Copy this private key and store it safely.<br>
            This is the only time it will be shown.<br>
            You will give this key to your AI agent later.
          </div>
        `;

        // 3. Add the public key as limited Function-Call key
        btn.innerText = "Confirm in wallet...";
        statusEl.innerText = "Adding limited Function-Call key... Confirm in your wallet";

        const wallet = await connector.wallet();
        await wallet.signAndSendTransaction({
          receiverId: businessAccount,
          actions: [
            {
              type: "AddKey",
              params: {
                publicKey: publicKeyStr,
                accessKey: {
                  nonce: 0,
                  permission: {
                    functionCall: {
                      receiverId: businessAccount,
                      methodNames: [],           // empty = can call any method on this account
                      allowance: "250000000000000000000000" // 0.25 NEAR gas allowance
                    }
                  }
                }
              }
            }
          ]
        });

        statusEl.className = "status-msg success";
        statusEl.innerText = "✅ Agent key granted successfully! Copy the private key above.";
        btn.innerText = "Agent Key Granted ✓";
        btn.disabled = true;

      } catch (err) {
        console.error(err);
        statusEl.className = "status-msg error";
        statusEl.innerText = err.message || "Failed to grant key. Try again.";
        btn.disabled = false;
        btn.innerText = "Grant Agent Access (Function-Call Key)";
      }
    }

    init();
  </script>
</body>
</html>
