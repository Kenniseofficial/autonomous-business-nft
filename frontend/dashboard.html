<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Owner Dashboard – Autonomous</title>
  <style>
    :root {
      --sidebar: #163226;
      --sidebar-active: #25513b;
      --bg: #f4f6f3;
      --card: #ffffff;
      --border: #e2e8e1;
      --ink: #15271f;
      --muted: #66756c;
      --green: #23744c;
      --green-soft: #e8f3e6;
      --hero: #173f2e;
      --lime: #cdeeaa;
      --danger: #c0392b;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--ink); line-height: 1.5; min-height: 100vh;
    }
    button { font-family: inherit; }
    a { color: inherit; }

    /* ---------- Layout ---------- */
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px; flex-shrink: 0; background: var(--sidebar); color: #e6efe9;
      position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column;
      padding: 24px 20px; z-index: 50; transition: transform .25s ease;
    }
    .brand { font-size: 1.55rem; font-weight: 600; letter-spacing: -0.02em; color: #fff; }
    .brand-sub { font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: #a9c1b3; margin-top: 4px; }
    .nav { margin-top: 48px; display: flex; flex-direction: column; gap: 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px;
      color: #cfe0d5; font-size: .92rem; cursor: pointer; border: none; background: none; text-align: left; width: 100%;
    }
    .nav-item:hover { background: rgba(255,255,255,.06); }
    .nav-item.active { background: var(--sidebar-active); color: #fff; font-weight: 600; }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .sidebar-foot { margin-top: auto; }
    .sys-box { background: rgba(255,255,255,.06); border-radius: 10px; padding: 12px; font-size: .7rem; color: #a9c1b3; }
    .sys-box .ok { color: #e6efe9; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-weight: 500; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); display: inline-block; }
    .foot-note { margin-top: 14px; font-size: .68rem; color: #86a393; }

    .main { margin-left: 220px; flex: 1; min-width: 0; }
    .topbar {
      background: #fff; height: 80px; padding: 0 36px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid var(--border);
    }
    .crumbs { font-size: .82rem; color: var(--muted); }
    .crumbs b { color: var(--ink); font-weight: 500; }
    .crumbs span.sep { margin: 0 10px; opacity: .6; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .pill {
      background: var(--bg); border-radius: 10px; padding: 8px 14px; font-size: .8rem;
      display: flex; align-items: center; gap: 8px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pill .dot { background: var(--sidebar); }
    .menu-btn { display: none; background: none; border: none; cursor: pointer; padding: 4px; color: var(--ink); }
    .menu-btn svg { width: 24px; height: 24px; }
    .mobile-brand { display: none; font-size: 1.4rem; font-weight: 600; letter-spacing: -0.02em; }

    .content { padding: 36px; max-width: 1200px; }
    .eyebrow { font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
    h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
    .page-sub { color: var(--muted); font-size: .92rem; margin-top: 10px; }
    .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .meta-line { font-size: .78rem; color: var(--muted); margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
    .meta-line a { color: var(--green); text-decoration: none; }

    /* ---------- Components ---------- */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .card h3 { font-size: 1.02rem; font-weight: 600; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
    .card-head .num { font-size: .72rem; color: var(--muted); }
    .card-sub { color: var(--muted); font-size: .82rem; margin-bottom: 14px; }
    .hint { color: var(--muted); font-size: .74rem; margin-top: 8px; }
    .label-sm { font-size: .8rem; color: var(--muted); }
    .big { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; margin: 6px 0 4px; }
    .big.green { color: var(--green); }
    .stack { display: flex; flex-direction: column; gap: 16px; }

    .btn {
      border: 1px solid transparent; border-radius: 10px; padding: 11px 18px; font-size: .88rem; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-lime { background: var(--lime); color: var(--hero); }
    .btn-ghost { background: #fff; border-color: var(--border); color: var(--ink); }
    .btn-danger { background: #fff; border-color: #e8b4ad; color: var(--danger); }
    .btn-block { width: 100%; }

    .badge {
      display: inline-flex; align-items: center; gap: 7px; background: var(--green-soft); color: var(--green);
      font-size: .74rem; font-weight: 600; padding: 5px 11px; border-radius: 8px;
    }
    .badge.pending { background: #fbf1d6; color: #9a7208; }
    .badge .dot { background: currentColor; width: 6px; height: 6px; }
    .tag { font-size: .66rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

    .stat-grid { display: grid; gap: 16px; margin-bottom: 20px; }
    .stat-grid.c4 { grid-template-columns: repeat(4, 1fr); }
    .stat-grid.c3 { grid-template-columns: repeat(3, 1fr); }
    .stat .big { font-size: 1.9rem; }

    .hero {
      background: var(--hero); color: #fff; border-radius: var(--radius); padding: 26px;
      display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 20px;
    }
    .hero .tag { color: #a9c9b5; }
    .hero .amount { font-size: 2.6rem; font-weight: 600; color: var(--lime); letter-spacing: -0.02em; line-height: 1.1; margin-top: 8px; }
    .hero .amount small { font-size: .85rem; color: #cfe3d6; font-weight: 400; margin-left: 8px; }
    .hero .from { margin: 14px 0; font-size: .85rem; color: #dcebe1; }

    .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .status-grid .v { font-size: 1.15rem; font-weight: 500; margin-top: 4px; }
    .status-grid .v.green { color: var(--green); }

    .table-head, .row {
      display: grid; grid-template-columns: 1fr 120px 110px; gap: 12px; align-items: center;
    }
    .table-head { font-size: .66rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; }
    .row { padding: 14px 0; border-top: 1px solid var(--border); }
    .row .t { font-weight: 500; font-size: .9rem; }
    .row .s { font-size: .78rem; color: var(--muted); }
    .empty { text-align: center; color: var(--muted); font-size: .88rem; padding: 26px 0; }

    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab { background: transparent; border: none; border-radius: 8px; padding: 6px 12px; font-size: .8rem; color: var(--muted); cursor: pointer; }
    .tab.active { background: var(--green-soft); color: var(--green); }

    .biz-card { margin-bottom: 20px; }
    .biz-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
    .biz-card h2 { font-size: 1.6rem; font-weight: 600; margin: 10px 0 8px; letter-spacing: -0.01em; }
    .biz-card p.desc { color: var(--muted); font-size: .88rem; margin-bottom: 16px; }
    .mini-stats { background: var(--bg); border-radius: 12px; padding: 16px 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .mini-stats .v { font-size: 1.2rem; font-weight: 600; margin-top: 2px; }
    .mini-stats .v.green { color: var(--green); }
    .biz-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: .78rem; flex-wrap: wrap; gap: 8px; }
    .biz-foot a { color: var(--green); text-decoration: none; word-break: break-all; }
    .biz-foot .healthy { color: var(--green); display: flex; align-items: center; gap: 7px; }
    .cta-band {
      background: #ebf3e8; border-radius: var(--radius); padding: 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px;
    }
    .cta-band h3 { font-size: 1.1rem; font-weight: 600; }
    .cta-band p { color: var(--muted); font-size: .85rem; margin-top: 6px; }

    .two-col { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 18px; align-items: start; }
    .biz-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0 0; }
    .biz-row .amt { color: var(--green); font-size: 1.1rem; font-weight: 600; }
    .steps { list-style: none; display: flex; flex-direction: column; gap: 16px; }
    .steps li { display: grid; grid-template-columns: 26px 1fr; gap: 6px; font-size: .86rem; }
    .steps li .n { color: var(--green); font-size: .74rem; font-weight: 600; padding-top: 2px; }
    .steps li .d { color: var(--muted); font-size: .78rem; }
    .kv { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 14px; }
    .kv b { color: var(--ink); font-weight: 500; }

    .banner { background: var(--green-soft); color: var(--green); border-radius: 10px; padding: 14px 18px; font-size: .85rem; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
    .banner .dot { background: var(--green); }
    .banner.warn { background: #fbf1d6; color: #9a7208; }
    .banner.warn .dot { background: #9a7208; }
    .cfg-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .8rem; font-weight: 500; margin-bottom: 6px; }
    .input, textarea.input {
      width: 100%; background: #fafbf9; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
      font-size: .88rem; color: var(--ink); font-family: inherit;
    }
    textarea.input { min-height: 84px; resize: vertical; }
    textarea.mono { font-family: ui-monospace, Menlo, monospace; font-size: .76rem; }
    .input:focus { outline: 2px solid rgba(35,116,76,.25); border-color: var(--green); }
    .two-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .alloc-bar { display: flex; gap: 4px; margin-bottom: 18px; }
    .alloc-bar i { height: 10px; border-radius: 4px; display: block; }
    .alloc-bar i:first-child { background: var(--green); }
    .alloc-bar i:last-child { background: #b9e08d; }
    .alloc-total { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: var(--muted); }
    .foot-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 12px; flex-wrap: wrap; }
    .foot-actions .btns { display: flex; gap: 10px; }

    .status-msg { font-size: .82rem; padding: 10px 12px; border-radius: 10px; margin-top: 12px; }
    .status-msg.error { background: #fbe4e1; color: var(--danger); }
    .status-msg.success { background: var(--green-soft); color: var(--green); }
    .status-msg.info { background: #e3edf9; color: #2b5fa3; }
    .key-box { background: #0f1f18; color: #d9efe0; border-radius: 12px; padding: 14px; margin-top: 14px; font-family: ui-monospace, Menlo, monospace; font-size: .72rem; word-break: break-all; }
    .key-box .k-title { font-family: inherit; font-weight: 600; margin-bottom: 6px; color: var(--lime); font-size: .78rem; }
    .key-box .k-val { user-select: all; }
    .key-box .k-warn { font-family: inherit; background: rgba(234,179,8,.14); color: #f2cf5a; padding: 10px; border-radius: 8px; margin-top: 8px; font-size: .74rem; line-height: 1.45; }
    .key-box hr { border: none; border-top: 1px solid rgba(255,255,255,.12); margin: 14px 0; }
    .info-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 14px; font-size: .82rem; white-space: pre-wrap; display: none; }
    .info-panel.show { display: block; }
    .result-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 14px; font-size: .82rem; white-space: pre-wrap; display: none; word-break: break-word; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid var(--border);
      color: var(--ink); padding: 12px 18px; border-radius: 12px; font-size: .88rem; max-width: 90%; z-index: 9999;
      opacity: 0; pointer-events: none; transition: opacity .3s; box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    #toast.show { opacity: 1; }
    #toast.error { border-color: var(--danger); color: var(--danger); }
    #toast.success { border-color: var(--green); color: var(--green); }

    .bottom-nav { display: none; }
    .scrim { display: none; }

    /* ---------- Tablet ---------- */
    @media (max-width: 1100px) {
      .stat-grid.c4 { grid-template-columns: repeat(2, 1fr); }
      .two-col, .cfg-grid { grid-template-columns: 1fr; }
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 860px) {
      .sidebar { transform: translateX(-100%); box-shadow: 8px 0 30px rgba(0,0,0,.25); }
      body.menu-open .sidebar { transform: translateX(0); }
      body.menu-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
      .main { margin-left: 0; }
      .topbar { height: 64px; padding: 0 20px; }
      .crumbs, .top-actions .pill { display: none; }
      .mobile-brand { display: block; }
      .menu-btn { display: block; }
      .content { padding: 22px 18px 110px; }
      h1 { font-size: 1.8rem; }
      .page-head { flex-direction: column; }
      .page-head .btn { display: none; }
      .page-head .btn.keep { display: inline-flex; }
      .stat-grid.c4 { grid-template-columns: 1fr 1fr; }
      .stat-grid.c3 { grid-template-columns: 1fr; }
      .hero { flex-direction: column; align-items: stretch; }
      .hero .btn { width: 100%; }
      .status-grid { grid-template-columns: 1fr; gap: 12px; }
      .status-grid > div { display: flex; justify-content: space-between; align-items: center; }
      .status-grid .v { margin: 0; font-size: 1rem; }
      .table-head { display: none; }
      .row { grid-template-columns: 1fr auto; }
      .row .time { grid-column: 1; }
      .mini-stats { grid-template-columns: 1fr; }
      .mini-stats > div { display: flex; justify-content: space-between; align-items: center; }
      .biz-top .btn { display: none; }
      .cta-band { flex-direction: column; align-items: stretch; }
      .cta-band .btn { width: 100%; }
      .two-inputs { grid-template-columns: 1fr; }
      .foot-actions { flex-direction: column-reverse; align-items: stretch; }
      .foot-actions .btns { flex-direction: column-reverse; }
      .foot-actions .btn { width: 100%; }
      .bottom-nav {
        display: flex; position: fixed; left: 16px; right: 16px; bottom: 14px; background: #fff; border: 1px solid var(--border);
        border-radius: 16px; padding: 6px; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.08);
      }
      .bottom-nav button { flex: 1; background: none; border: none; padding: 12px 4px; font-size: .86rem; color: var(--muted); cursor: pointer; border-radius: 12px; }
      .bottom-nav button.active { color: var(--green); font-weight: 600; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div>
        <div class="brand">autonomous</div>
        <div class="brand-sub">Businesses on NEAR</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="sys-box">
          <div class="ok"><span class="dot"></span> All systems operational</div>
          <div>NEAR Protocol · Testnet</div>
        </div>
        <div class="foot-note">Autonomous by design.</div>
      </div>
    </aside>
    <div class="scrim" data-action="close-menu"></div>

    <div class="main">
      <header class="topbar">
        <div class="mobile-brand">autonomous</div>
        <div class="crumbs" id="crumbs"></div>
        <div class="top-actions">
          <div class="pill"><span class="dot"></span> NEAR Protocol</div>
          <div class="pill" id="ownerPill">Not connected</div>
          <button class="menu-btn" data-action="toggle-menu" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl.min.js"></script>
  <script type="importmap">
  { "imports": { "@hot-labs/near-connect": "https://esm.sh/@hot-labs/near-connect@0.12.0" } }
  </script>

  <script type="module">
    import { NearConnector } from "@hot-labs/near-connect";

    /* =====================================================================
       CONFIG
       ===================================================================== */
    const CONTRACT_ID = "buildingfromthetop.testnet";
    const NETWORK = "testnet";
    const RPC_URL = "https://rpc.testnet.near.org";
    const OUTLAYER_API = "https://testnet-api.outlayer.ai";
    const CONFIG_STORAGE_KEY = "autonomous.agentConfig.v1";
    const STORAGE_RESERVE_NEAR = 0.005;
    const CLAIM_METHOD = "claim";            // method that must exist on each business account's contract
    const CLAIM_GAS = "50000000000000";      // 50 Tgas (cross-contract owner check + transfer)
    const ACTIVATE_GAS = "150000000000000";  // 150 Tgas (create account + deploy treasury + add key)
    const ACTIVATION_DEPOSIT_YOCTO = "2000000000000000000000000"; // 2 NEAR (contract minimum is 1.5)
    const ROTATE_GAS = "60000000000000";     // 60 Tgas
    const MARKETPLACE_URL = "https://market.near.ai"; // "Explore marketplace" target (legacy copy: https://market-legacy.near.ai)

    /* =====================================================================
       STATE
       ===================================================================== */
    let connector = null;
    const state = {
      accountId: null,
      walletBalance: null,
      businesses: [],          // { tokenId, title, description, account, balance, active }
      selectedId: null,
      loading: false,
      loaded: false,
      loadError: false,
      view: "overview",
      filter: "all",
      search: "",
      keys: {},                // tokenId -> { privateKey, outlayerKey }
      status: {},              // tokenId -> { cls, msg }
      transferOpen: {},        // tokenId -> bool
      config: loadConfig()
    };

    /* =====================================================================
       HELPERS
       ===================================================================== */
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const shortAcct = (a) => (a && a.length > 22 ? a.slice(0, 10) + "…" + a.slice(-8) : a);
    const fmtNear = (v) => (v === null || v === undefined ? "—" : v + " Ⓝ");
    const businessAccountFor = (tokenId) => "business-" + tokenId + "." + CONTRACT_ID;

    function showToast(message, type = "info") {
      const el = $("toast");
      el.textContent = message;
      el.className = "show " + type;
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.className = ""; }, 4000);
    }

    function loadConfig() {
      const defaults = {
        description: "Autonomous AI agent that conducts geo-economic research, monitors global markets, and delivers structured intelligence reports.",
        price: "15.00", min: "0.00", max: "5.00", reinvest: 40, owner: 60
      };
      try {
        const saved = JSON.parse(localStorage.getItem(CONFIG_STORAGE_KEY) || "null");
        return saved ? { ...defaults, ...saved } : defaults;
      } catch (e) { return defaults; }
    }

    const ICONS = {
      overview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
      businesses: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
      wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/></svg>',
      config: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>'
    };

    const NAV = [
      { id: "overview", label: "Overview", mobile: "Overview", icon: ICONS.overview },
      { id: "businesses", label: "My businesses", mobile: "Businesses", icon: ICONS.businesses },
      { id: "wallet", label: "Wallet", mobile: "Wallet", icon: ICONS.wallet },

    function toBase58(bytes) {
      const ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
      let num = BigInt(0);
      for (let i = 0; i < bytes.length; i++) num = (num << 8n) + BigInt(bytes[i]);
      let str = "";
      while (num > 0n) { str = ALPHABET[Number(num % 58n)] + str; num = num / 58n; }
      for (let i = 0; i < bytes.length && bytes[i] === 0; i++) str = "1" + str;
      return str;
    }

    function generateKeyPair() {
      if (typeof nacl === "undefined") throw new Error("Crypto library not loaded. Please refresh.");
      const kp = nacl.sign.keyPair();
      const seed = kp.secretKey.slice(0, 32);
      return {
        privateKeyStr: "ed25519:" + toBase58(seed),
        publicKeyStr: "ed25519:" + toBase58(kp.publicKey)
      };
    }

    async function getAccountBalance(accountId) {
      try {
        const res = await fetch(RPC_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0", id: "1", method: "query",
            params: { request_type: "view_account", finality: "final", account_id: accountId }
          })
        });
        const data = await res.json();
        if (data.result && data.result.amount) return (Number(data.result.amount) / 1e24).toFixed(4);
        return null;
      } catch (e) { return null; }
    }

    // Total balance plus the part that can actually be claimed (total minus storage backing the treasury code, minus a small reserve)
    async function getAccountInfo(accountId) {
      try {
        const res = await fetch(RPC_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0", id: "1", method: "query",
            params: { request_type: "view_account", finality: "final", account_id: accountId }
          })
        });
        const data = await res.json();
        if (!data.result || !data.result.amount) return null;
        const total = BigInt(data.result.amount);
        const locked = BigInt(data.result.storage_usage || 0) * 10n ** 19n;
        const free = total > locked ? total - locked : 0n;
        const freeNear = Number(free) / 1e24;
        return {
          balance: (Number(total) / 1e24).toFixed(4),
          claimable: Math.max(0, freeNear - STORAGE_RESERVE_NEAR)
        };
      } catch (e) { return null; }
    }

    /* =====================================================================
       DATA LOADING  (nft_tokens_for_owner)
       ===================================================================== */
    async function loadBusinesses() {
      if (!state.accountId) return;
      state.loading = true; state.loadError = false; render();
      try {
        const res = await fetch(RPC_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0", id: "1", method: "query",
            params: {
              request_type: "call_function", finality: "final", account_id: CONTRACT_ID,
              method_name: "nft_tokens_for_owner",
              args_base64: btoa(JSON.stringify({ account_id: state.accountId }))
            }
          })
        });
        const data = await res.json();
        const bytes = data.result?.result;
        let tokens = [];
        if (bytes) tokens = JSON.parse(new TextDecoder().decode(new Uint8Array(bytes))) || [];

        const list = [];
        for (const token of tokens) {
          const tokenId = String(token.token_id);
          const account = businessAccountFor(tokenId);
          const info = await getAccountInfo(account);
          const balance = info ? info.balance : null;
          list.push({
            tokenId, account, balance,
            claimable: info ? info.claimable : 0,
            active: balance !== null,
            title: token.metadata?.title || "Untitled",
            description: token.metadata?.description || "No description"
          });
        }
        state.businesses = list;
        if (!list.find(b => b.tokenId === state.selectedId)) state.selectedId = list[0]?.tokenId || null;
        state.loaded = true;
      } catch (err) {
        state.loadError = true;
        showToast("Failed to load businesses", "error");
      }
      state.loading = false;
      render();
    }

    async function activateBusiness(tokenId, btn) {
      const businessAccount = businessAccountFor(tokenId);
      try {
        btn.disabled = true; btn.textContent = "Confirm in wallet...";
        setStatus(tokenId, "info", "Creating treasury + Agent Function-Call key... Confirm in your wallet");

        const { privateKeyStr, publicKeyStr } = generateKeyPair();
        state.keys[tokenId] = { privateKey: privateKeyStr, outlayerKey: null };
        refreshKeyBox(tokenId);

        // The NFT contract creates the business account, funds it with the deposit,
        // deploys the treasury contract and adds the agent key. Only the NFT owner may call this.
        const wallet = await connector.wallet();
        await wallet.signAndSendTransaction({
          receiverId: CONTRACT_ID,
          actions: [{
            type: "FunctionCall",
            params: {
              methodName: "activate_business",
              args: { token_id: tokenId, agent_public_key: publicKeyStr },
              gas: ACTIVATE_GAS,
              deposit: ACTIVATION_DEPOSIT_YOCTO
            }
          }]
        });

        const outlayer = await registerOutlayerWallet();
        if (outlayer && outlayer.api_key) { state.keys[tokenId].outlayerKey = outlayer.api_key; refreshKeyBox(tokenId); }

        setStatus(tokenId, "success", "✅ Business activated! Agent key has been added.");
        btn.textContent = "Activated ✓";
        showToast("Agent key granted successfully! Copy the private key now.", "success");
        setTimeout(() => loadBusinesses(), 60000);
      } catch (err) {
        setStatus(tokenId, "error", err.message || "Activation failed or cancelled");
        showToast(err.message || "Activation failed", "error");
        btn.disabled = false; btn.textContent = "Activate business";
      }
    }

    function refreshKeyBox(tokenId) {
      const holder = document.getElementById("keyholder-" + tokenId);
      if (holder) holder.innerHTML = renderKeyBox(tokenId);
    }

    async function claimRevenue(tokenId, btn) {
      const biz = state.businesses.find(b => b.tokenId === tokenId);
      if (!biz) return showToast("Business account not found", "error");
      const original = btn.textContent;
      try {
        btn.disabled = true; btn.textContent = "Claiming...";
        setStatus(tokenId, "info", "Preparing claim... Confirm in your wallet");

        // Claimable = balance minus the storage that backs the treasury contract, minus a small reserve
        const info = await getAccountInfo(biz.account);
        if (!info || info.claimable < 0.01) throw new Error("Treasury balance too low to claim (need at least 0.01 NEAR above the storage reserve)");

        // BigInt avoids float / scientific-notation bugs
        const claimNear = info.claimable;
        const claimAmountYocto = (BigInt(Math.floor(claimNear * 1e4)) * 10n ** 20n).toString();

        // Calls `claim` on the business account's contract. The contract checks that the caller
        // owns the NFT, then transfers `amount` from the business account to the caller.
        const wallet = await connector.wallet();
        await wallet.signAndSendTransaction({
          receiverId: biz.account,
          actions: [{
            type: "FunctionCall",
            params: {
              methodName: CLAIM_METHOD,
              args: { amount: claimAmountYocto },
              gas: CLAIM_GAS,
              deposit: "0"
            }
          }]
        });

        setStatus(tokenId, "success", `✅ Claimed ~${claimNear.toFixed(4)} NEAR to your wallet`);
        showToast("Revenue claimed successfully", "success");
        setTimeout(() => loadBusinesses(), 5000);
      } catch (err) {
        setStatus(tokenId, "error", err.message || "Claim failed or cancelled");
        showToast(err.message || "Claim failed", "error");
        btn.disabled = false; btn.textContent = original;
      }
    }

    async function rotateAgentKey(tokenId, btn) {
      const biz = state.businesses.find(b => b.tokenId === tokenId);
      if (!biz || !biz.active) return showToast("Activate the business first", "error");
      try {
        btn.disabled = true;
        const { privateKeyStr, publicKeyStr } = generateKeyPair();
        // The NFT contract swaps the key on the business account (adds the new one, removes the old one)
        const wallet = await connector.wallet();
        await wallet.signAndSendTransaction({
          receiverId: CONTRACT_ID,
          actions: [{
            type: "FunctionCall",
            params: {
              methodName: "rotate_agent_key",
              args: { token_id: tokenId, agent_public_key: publicKeyStr },
              gas: ROTATE_GAS,
              deposit: "0"
            }
          }]
        });
        state.keys[tokenId] = { ...(state.keys[tokenId] || {}), privateKey: privateKeyStr };
        refreshKeyBox(tokenId);
        showToast("New agent key created. Copy it now.", "success");
      } catch (err) {
        showToast(err.message || "Key rotation failed", "error");
      }
      btn.disabled = false;
    }

    async function checkOutlayerBalance() {
      const apiKey = ($("outlayerApiKey")?.value || "").trim();

      if (!apiKey.startsWith("wk_")) return showToast("Key must start with wk_", "error");
      setPanel("agentResult", "Checking OutLayer balance...");
      try {

          method: "GET", headers: { "Authorization": "Bearer " + apiKey, "Accept": "application/json" }
        });
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch (e) { data = text; }
        if (!res.ok) {
          let message = "OutLayer Error " + res.status + "\n\n" + (typeof data === "string" ? data : JSON.stringify(data, null, 2));
          message += "\n\nPossible reasons:\n• Key is a trial key that needs claiming\n• Key was not fully registered\n• Testnet key expired or invalid";
          return setPanel("agentResult", message);
        }
        setPanel("agentResult", "✅ OutLayer Balance:\n\n" + JSON.stringify(data, null, 2));
      } catch (err) {
        setPanel("agentResult", "Network / CORS error:\n" + err.message);
      }

        ${b.active ? "" : `<div style="margin-top:14px">${businessActions(b)}</div>`}
        ${b.active ? `<div class="btn-row" style="margin-top:14px">
          <button class="btn btn-ghost" data-action="claim" data-id="${esc(b.tokenId)}">Claim revenue</button>
          <button class="btn btn-ghost" data-action="toggle-transfer" data-id="${esc(b.tokenId)}">Sell / Transfer</button>
        </div>${transferPanel(b)}${businessActions(b)}` : ""}
      </div>`;
    }

    /* =====================================================================
       VIEW: Wallet
       ===================================================================== */
    function viewWallet() {
      const connected = !!state.accountId;
      const claimable = totalClaimable();
      const claimBiz = state.businesses.find(b => b.active && b.claimable > 0) || null;
      const heroBtn = connected
        ? `<button class="btn btn-lime" data-action="claim" data-id="${esc(claimBiz?.tokenId || "")}" ${claimBiz ? "" : "disabled"}>Claim to wallet →</button>`
        : `<button class="btn btn-lime" data-action="connect">Connect to claim →</button>`;

      return `
        <div class="eyebrow">Your earnings</div>
        <div class="page-head">
          <div><h1>Wallet</h1><div class="page-sub">Manage and claim profits from your autonomous businesses.</div></div>
          ${connected
            ? `<button class="btn btn-primary" data-action="disconnect">Disconnect wallet</button>`
            : `<button class="btn btn-primary" data-action="connect">Connect wallet</button>`}
        </div>

        <div class="two-col">
          <div class="stack">
            <div class="hero" style="flex-direction:column;align-items:stretch;margin:0">
              <div>
                <div class="tag">Available to claim</div>
                <div class="amount">${claimable.toFixed(4)}<small>NEAR</small></div>
              </div>
              <div class="from">${claimBiz ? "From " + esc(claimBiz.title) + " #" + esc(claimBiz.tokenId) : "No claimable profits yet"}</div>
              <div>${heroBtn}</div>
              ${claimBiz ? `<div class="status-msg ${esc(state.status[claimBiz.tokenId]?.cls || "")}" id="status-${esc(claimBiz.tokenId)}" style="display:${state.status[claimBiz.tokenId] ? "block" : "none"}">${esc(state.status[claimBiz.tokenId]?.msg || "")}</div>` : ""}
            </div>

            <div class="card">
              <div class="card-head"><h3>Claimable by business</h3><span class="badge">${state.businesses.filter(b => b.active).length} business</span></div>
              ${state.businesses.filter(b => b.active).map(b => `
                <div style="margin-bottom:14px">
                  <div class="biz-row"><div><div style="font-weight:600">${esc(b.title)} #${esc(b.tokenId)}</div><div class="label-sm" style="font-size:.72rem">${esc(b.account)}</div></div>
                  <div class="amt">${(b.claimable || 0).toFixed(4)} Ⓝ</div></div>
                </div>`).join("") || `<div class="empty">${connected ? "No active businesses." : "Connect your wallet to see claimable profits."}</div>`}
            </div>

            <div class="card">
              <div class="card-head"><h3>Recent allocations</h3></div>
              <div class="card-sub">Owner profit allocations, not wallet transfers.</div>
              <div class="empty" style="border-top:1px solid var(--border)">No allocations yet.</div>
            </div>
          </div>

          <div class="stack">
            <div class="card"><div class="label-sm">Business net earnings</div><div class="big green">—</div><div class="label-sm" style="font-size:.74rem">This month · before profit distribution</div></div>
            <div class="card"><div class="label-sm">Agent treasury</div><div class="big">${totalTreasury().toFixed(4)} Ⓝ</div><div class="label-sm" style="font-size:.74rem">Held by the business, separate from your wallet</div></div>

            <div class="card">
              <div class="card-head"><h3>Your wallet</h3><span class="label-sm" style="font-size:.7rem">${connected ? "Connected" : "Not connected"}</span></div>
              ${connected
                ? `<div class="card-sub" style="word-break:break-all">${esc(state.accountId)}</div>
                   <div class="big" style="font-size:1.5rem">${esc(fmtNear(state.walletBalance))}</div>
                   <button class="btn btn-ghost btn-block" data-action="disconnect" style="margin-top:10px">Disconnect wallet</button>`
                : `<div class="card-sub">Connect your NEAR wallet to view its balance and receive your business profits.</div>
                   <button class="btn btn-primary btn-block" data-action="connect">Connect wallet</button>`}
              <div class="kv"><span>Network</span><b>NEAR Protocol</b></div>
            </div>

            <div class="card">
              <div class="card-head"><h3>How claiming works</h3></div>
              <ol class="steps">
                <li><span class="n">01</span><div>Connect your wallet<div class="d">Choose the wallet that will receive your profits.</div></div></li>
                <li><span class="n">02</span><div>Review your claim<div class="d">Check the available balance from your business.</div></div></li>
                <li><span class="n">03</span><div>Confirm the transfer<div class="d">Approve the transaction in your wallet.</div></div></li>
              </ol>
            </div>
          </div>
        </div>`;
    }

    /* =====================================================================
       VIEW: Configuration (+ Agent control)
       ===================================================================== */
    function viewConfig() {
      const c = state.config;
      const b = selected();
      const total = Number(c.reinvest) + Number(c.owner);
      const okTotal = total === 100;
      return `
        ${b ? `<a href="#" data-action="goto" data-id="overview" style="color:var(--green);font-size:.8rem;text-decoration:none">← ${esc(b.title)} #${esc(b.tokenId)}</a>` : ""}
        <div class="page-head" style="margin-top:12px">
          <div><h1>Configuration</h1><div class="page-sub">Manage how your agent works, earns and stays secure.</div></div>
        </div>
        <div class="banner ${b && b.active ? "" : "warn"}"><span class="dot"></span>${b && b.active ? "Your agent is active. Updates apply to future jobs." : "Your agent is not active yet. Activate a business to apply changes."}</div>

        <div class="cfg-grid">
          <div class="stack">
            <div class="card">
              <div class="card-head"><h3>Service description</h3><span class="num">01</span></div>
              <div class="card-sub">Tell clients what your autonomous agent can do.</div>
              <textarea class="input" id="cfgDesc">${esc(c.description)}</textarea>
              <div class="hint">A clear description helps clients find the right agent.</div>
            </div>

            <div class="card">
              <div class="card-head"><h3>Pricing</h3><span class="num">02</span></div>
              <div class="card-sub">Set your base rate and optional premium add-ons.</div>
              <div class="field"><label>Base price per job</label><input class="input" id="cfgPrice" value="${esc(c.price)}" inputmode="decimal" /><div class="hint">Charged for each completed standard job.</div></div>
              <div class="two-inputs">
                <div class="field"><label>Premium add-ons · minimum</label><input class="input" id="cfgMin" value="${esc(c.min)}" inputmode="decimal" /></div>
                <div class="field"><label>Premium add-ons · maximum</label><input class="input" id="cfgMax" value="${esc(c.max)}" inputmode="decimal" /></div>
              </div>
              <div class="hint">All prices are denominated in USDC.</div>
            </div>

            <div class="card">
              <div class="card-head"><h3>Agent control</h3><span class="num">05</span></div>
              <div class="card-sub">Use the Function-Call key to control the business.</div>
              <div class="field"><label>Business account</label><input class="input" id="agentBusinessAccount" placeholder="business-10.buildingfromthetop.testnet" value="${b ? esc(b.account) : ""}" /></div>
              <div class="field"><label>Private key (ed25519:...)</label><textarea class="input mono" id="agentPrivateKey" placeholder="Paste the private key you copied during activation"></textarea></div>
              <div class="field"><label>OutLayer API key (wk_...)</label><input class="input" id="outlayerApiKey" placeholder="wk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" /></div>
              <div class="btn-row">
                <button class="btn btn-primary" data-action="check-treasury">Check treasury balance</button>
                <button class="btn btn-ghost" data-action="check-outlayer">Check OutLayer balance</button>
                <button class="btn btn-ghost" data-action="toggle-agent-info">How to run full agent</button>
              </div>
              <div class="result-panel" id="agentResult"></div>
              <div class="info-panel" id="agentInfoPanel"></div>
            </div>
          </div>

          <div class="stack">
            <div class="card">
              <div class="card-head"><h3>Profit distribution</h3><span class="num">03</span></div>
              <div class="card-sub">Choose how every payout is allocated.</div>
              <div class="alloc-bar"><i id="barA" style="flex:${Number(c.reinvest) || 0}"></i><i id="barB" style="flex:${Number(c.owner) || 0}"></i></div>
              <div class="field"><label>Reinvest into treasury (%)</label><input class="input" id="cfgReinvest" value="${esc(c.reinvest)}" inputmode="numeric" /><div class="hint">Funds your agent's future operations.</div></div>
              <div class="field"><label>Send to owner (%)</label><input class="input" id="cfgOwner" value="${esc(c.owner)}" inputmode="numeric" /><div class="hint">Available as claimable profits.</div></div>
              <div class="alloc-total"><span>Total allocation</span><span class="badge ${okTotal ? "" : "pending"}" id="allocBadge">${okTotal ? "100% allocated" : total + "% allocated"}</span></div>
            </div>

            <div class="card">
              <div class="card-head"><h3>Agent security</h3><span class="num">04</span></div>
              <div class="card-sub">Rotate the agent's signing key for enhanced security.</div>
              <button class="btn btn-ghost btn-block" data-action="rotate-key" ${b && b.active ? "" : "disabled"}>↻ Rotate agent key</button>
              <div class="hint">Key rotation is separate from other settings.</div>
              ${b ? `<div id="keyholder-${esc(b.tokenId)}">${renderKeyBox(b.tokenId)}</div>` : ""}
            </div>
          </div>
        </div>

        <div class="foot-actions">
          <span class="label-sm">Review your changes before saving.</span>
          <div class="btns">
            <button class="btn btn-ghost" data-action="cancel-config">Cancel</button>
            <button class="btn btn-primary" data-action="save-config">Save changes</button>
          </div>
        </div>`;
    }

    /* =====================================================================
       RENDER (shell + current view)
       ===================================================================== */
    const VIEWS = { overview: viewOverview, businesses: viewBusinesses, wallet: viewWallet, config: viewConfig };
    const CRUMBS = {
      overview: () => { const b = selected(); return `My businesses<span class="sep">/</span><b>${esc(b ? b.title : "Overview")}</b>`; },
      businesses: () => `Workspace<span class="sep">/</span><b>My businesses</b>`,
      wallet: () => `Workspace<span class="sep">/</span><b>Wallet</b>`,
      config: () => `My businesses<span class="sep">/</span><b>Configuration</b>`
    };

    function render() {
      $("nav").innerHTML = NAV.map(n =>
        `<button class="nav-item ${state.view === n.id ? "active" : ""}" data-action="goto" data-id="${n.id}">${n.icon}${n.label}</button>`).join("");
      $("bottomNav").innerHTML = NAV.map(n =>
        `<button class="${state.view === n.id ? "active" : ""}" data-action="goto" data-id="${n.id}">${n.mobile}</button>`).join("");
      $("crumbs").innerHTML = CRUMBS[state.view]();
      $("ownerPill").textContent = state.accountId ? "Owner · " + shortAcct(state.accountId) : "Not connected";

      const active = document.activeElement;
      const keepSearch = active && active.id === "searchInput";
      $("view").innerHTML = VIEWS[state.view]();
      if (keepSearch) { const el = $("searchInput"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      document.querySelectorAll("[data-mobile-view]").forEach(el => { el.className += " mobile-only"; });
    }

    /* =====================================================================
       EVENTS (single delegated handlers)
       ===================================================================== */
    document.addEventListener("click", (e) => {
      const el = e.target.closest("[data-action]");
      if (!el) return;
      const action = el.dataset.action, id = el.dataset.id;
      if (el.tagName === "A" && el.getAttribute("href") === "#") e.preventDefault();

      switch (action) {
        case "goto": state.view = id; document.body.classList.remove("menu-open"); render(); window.scrollTo(0, 0); break;
        case "toggle-menu": document.body.classList.toggle("menu-open"); break;
        case "close-menu": document.body.classList.remove("menu-open"); break;
        case "connect": connectWallet(); break;
        case "disconnect": disconnectWallet(); break;
        case "reload": loadBusinesses(); break;
        case "filter": state.filter = id; render(); break;
        case "select": state.selectedId = id; state.view = "overview"; render(); window.scrollTo(0, 0); break;
        case "activate": activateBusiness(id, el); break;
        case "claim":
          if (!id) return showToast("Nothing to claim yet", "error");
          if (!state.accountId) return connectWallet();
          claimRevenue(id, el); break;
        case "toggle-transfer":
          state.transferOpen[id] = !state.transferOpen[id];
          document.getElementById("transfer-" + id)?.classList.toggle("show", !!state.transferOpen[id]); break;
        case "rotate-key": { const b = selected(); if (b) rotateAgentKey(b.tokenId, el); break; }
        case "check-treasury": checkAgentBalance(); break;
        case "check-outlayer": checkOutlayerBalance(); break;
        case "toggle-agent-info": toggleAgentInfo(); break;
        case "save-config": saveConfig(); break;
        case "cancel-config": state.config = loadConfig(); render(); showToast("Changes discarded"); break;
      }
    });

    document.addEventListener("input", (e) => {
      const t = e.target;
      if (t.id === "searchInput") {
        state.search = t.value;
        const list = state.businesses.filter(b => state.filter !== "active" || b.active)
          .filter(b => (b.title + " " + b.account + " " + b.description).toLowerCase().includes(state.search.trim().toLowerCase()));
        $("bizList").innerHTML = list.length ? list.map(bizCard).join("") : `<div class="card empty">No businesses match.</div>`;
      }
      if (t.id === "cfgReinvest" || t.id === "cfgOwner") {
        const clamp = (v) => Math.max(0, Math.min(100, parseInt(v, 10) || 0));
        if (t.id === "cfgReinvest") $("cfgOwner").value = 100 - clamp(t.value);
        else $("cfgReinvest").value = 100 - clamp(t.value);
        syncAllocation();
      }
    });

    function syncAllocation() {
      const r = Number($("cfgReinvest").value) || 0, o = Number($("cfgOwner").value) || 0;
      $("barA").style.flex = r; $("barB").style.flex = o;
      const badge = $("allocBadge");
      badge.textContent = (r + o) + "% allocated" ;
      badge.className = "badge " + (r + o === 100 ? "" : "pending");
      if (r + o === 100) badge.textContent = "100% allocated";
    }

    function saveConfig() {
      const next = {
        description: $("cfgDesc").value.trim(),
        price: $("cfgPrice").value.trim(), min: $("cfgMin").value.trim(), max: $("cfgMax").value.trim(),
        reinvest: Number($("cfgReinvest").value) || 0, owner: Number($("cfgOwner").value) || 0
      };
      if (next.reinvest + next.owner !== 100) return showToast("Profit distribution must total 100%", "error");
      if (!(Number(next.price) >= 0)) return showToast("Enter a valid base price", "error");
      state.config = next;
      try { localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(next)); } catch (e) {}
      showToast("Configuration saved", "success");
    }

    init();
  </script>
  <style>
    /* mobile-only helper for the duplicate "View business" button */
    .mobile-only { display: none !important; }
    @media (max-width: 860px) { .mobile-only { display: inline-flex !important; } }
  </style>
</body>
</html>
