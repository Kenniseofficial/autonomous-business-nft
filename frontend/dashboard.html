<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Owner Dashboard – Autonomous Business NFT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #050508;
      color: #f4f4f5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 440px; margin: 0 auto; padding: 16px 16px 80px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0 20px;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .logo-box {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 9px; display: grid; place-items: center;
    }
    .back { color: #a1a1aa; text-decoration: none; font-size: 0.9rem; }
    .header { margin-bottom: 20px; }
    .header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .header .sub { color: #a1a1aa; font-size: 0.9rem; }
    .account-box {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-green { background: #22c55e; color: #000; }
    .btn-red { background: transparent; border: 1px solid #ef4444; color: #ef4444; }
    .btn-outline {
      background: transparent;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .business-card {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .business-card h3 { font-size: 1.15rem; margin-bottom: 6px; }
    .business-card p { color: #a1a1aa; font-size: 0.9rem; margin-bottom: 10px; }
    .token-id { font-size: 0.8rem; color: #71717a; margin-bottom: 8px; }
    .treasury { color: #4ade80; font-size: 0.85rem; word-break: break-all; margin-bottom: 12px; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: #18181b;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .stat .label { font-size: 0.75rem; color: #71717a; }
    .stat .value { font-size: 1.05rem; font-weight: 600; margin-top: 2px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .badge-live { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-pending { background: rgba(234,179,8,0.15); color: #eab308; }
    .status-msg {
      font-size: 0.85rem;
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }
    .status-msg.error { background: rgba(239,68,68,0.15); color: #f87171; display: block; }
    .status-msg.success { background: rgba(34,197,94,0.15); color: #4ade80; display: block; }
    .status-msg.info { background: rgba(59,130,246,0.15); color: #60a5fa; display: block; }
    .key-box {
      background: #0c0c0e;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      font-family: monospace;
      font-size: 0.72rem;
      word-break: break-all;
      display: none;
    }
    .key-box.show { display: block; }
    .warning {
      background: rgba(234,179,8,0.12);
      color: #eab308;
      font-size: 0.78rem;
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      line-height: 1.4;
    }
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      max-width: 90%;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    #toast.show { opacity: 1; }
    #toast.error { border-color: #ef4444; color: #f87171; }
    #toast.success { border-color: #22c55e; color: #4ade80; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">
        <div class="logo-box">◆</div>
        <span>Business NFT</span>
      </div>
      <a href="/" class="back">← Mint</a>
    </div>

    <div class="header">
      <h1>Owner Dashboard</h1>
      <div class="sub">Your Autonomous Businesses</div>
    </div>

    <button id="connectBtn" class="btn btn-green">Connect Wallet</button>
    <button id="disconnectBtn" class="btn btn-red" style="display:none;">Disconnect Wallet</button>

    <div id="accountBox" class="account-box" style="display:none;">
      Connected as<br>
      <strong id="accountIdDisplay"></strong>
    </div>

    <div id="list"></div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "@hot-labs/near-connect": "https://esm.sh/@hot-labs/near-connect@0.12.0"
    }
  }
  </script>

  <script type="module">
    import { NearConnector } from "@hot-labs/near-connect";

    const CONTRACT_ID = "buildingfromthetop.testnet";
    const NETWORK = "testnet";

    let connector = null;
    let accountId = null;

    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const accountBox = document.getElementById("accountBox");
    const accountIdDisplay = document.getElementById("accountIdDisplay");
    const listEl = document.getElementById("list");
    const toastEl = document.getElementById("toast");

    function showToast(message, type = "info") {
      toastEl.textContent = message;
      toastEl.className = "show " + type;
      clearTimeout(toastEl._timer);
      toastEl._timer = setTimeout(() => {
        toastEl.className = "";
      }, 4000);
    }

    function toBase58(bytes) {
      const ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
      let num = BigInt(0);
      for (let i = 0; i < bytes.length; i++) {
        num = (num << 8n) + BigInt(bytes[i]);
      }
      let str = "";
      while (num > 0n) {
        str = ALPHABET[Number(num % 58n)] + str;
        num = num / 58n;
      }
      for (let i = 0; i < bytes.length && bytes[i] === 0; i++) {
        str = "1" + str;
      }
      return str;
    }

    function generateKeyPair() {
      if (typeof nacl === "undefined") {
        throw new Error("Crypto library not loaded. Please refresh.");
      }
      const kp = nacl.sign.keyPair();
      const seed = kp.secretKey.slice(0, 32);
      const publicKey = kp.publicKey;
      return {
        privateKeyStr: "ed25519:" + toBase58(seed),
        publicKeyStr: "ed25519:" + toBase58(publicKey)
      };
    }

    async function getAccountBalance(accountId) {
      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "1",
            method: "query",
            params: {
              request_type: "view_account",
              finality: "final",
              account_id: accountId
            }
          })
        });
        const data = await res.json();
        if (data.result && data.result.amount) {
          return (Number(data.result.amount) / 1e24).toFixed(4);
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    function updateUI() {
      if (accountId) {
        connectBtn.style.display = "none";
        disconnectBtn.style.display = "block";
        accountBox.style.display = "block";
        accountIdDisplay.textContent = accountId;
      } else {
        connectBtn.style.display = "block";
        disconnectBtn.style.display = "none";
        accountBox.style.display = "none";
        listEl.innerHTML = "";
      }
    }

    async function init() {
      connector = new NearConnector({
        network: NETWORK,
        features: { signAndSendTransaction: true },
        autoConnect: true
      });

      connector.on("wallet:signIn", async () => {
        const connected = await connector.getConnectedWallet();
        if (connected?.accounts?.length) {
          accountId = connected.accounts[0].accountId;
          updateUI();
          loadBusinesses();
        }
      });

      connector.on("wallet:signOut", () => {
        accountId = null;
        updateUI();
      });

      await new Promise(r => setTimeout(r, 500));
      try {
        const connected = await connector.getConnectedWallet();
        if (connected?.accounts?.length) {
          accountId = connected.accounts[0].accountId;
          updateUI();
          loadBusinesses();
        }
      } catch (e) {}
    }

    connectBtn.addEventListener("click", async () => {
      try {
        await connector.connect();
      } catch (err) {
        showToast(err.message || "Connect failed", "error");
      }
    });

    disconnectBtn.addEventListener("click", async () => {
      try {
        await connector.disconnect();
        accountId = null;
        updateUI();
      } catch (err) {}
    });

    async function loadBusinesses() {
      if (!accountId) return;
      listEl.innerHTML = `<div style="color:#a1a1aa;padding:20px 0;text-align:center;">Loading your businesses...</div>`;

      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "1",
            method: "query",
            params: {
              request_type: "call_function",
              finality: "final",
              account_id: CONTRACT_ID,
              method_name: "nft_tokens_for_owner",
              args_base64: btoa(JSON.stringify({ account_id: accountId }))
            }
          })
        });

        const data = await res.json();
        const bytes = data.result?.result;
        if (!bytes) {
          listEl.innerHTML = `<div style="color:#a1a1aa;padding:20px 0;text-align:center;">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        const tokens = JSON.parse(String.fromCharCode(...bytes));
        if (!tokens || tokens.length === 0) {
          listEl.innerHTML = `<div style="color:#a1a1aa;padding:20px 0;text-align:center;">No businesses yet.<br>Go back and mint one.</div>`;
          return;
        }

        listEl.innerHTML = "";

        for (const token of tokens) {
          const tokenId = String(token.token_id);
          const businessAccount = "business-" + tokenId + "." + CONTRACT_ID;
          const title = token.metadata?.title || "Untitled";
          const description = token.metadata?.description || "No description";

          const balance = await getAccountBalance(businessAccount);
          const isActive = balance !== null;

          const card = document.createElement("div");
          card.className = "business-card";
          card.innerHTML = `
            <h3>${title}</h3>
            <p>${description}</p>
            <div class="token-id">Token ID: ${tokenId}</div>
            <div class="treasury">Treasury: ${businessAccount}</div>
            <div class="stats">
              <div class="stat">
                <div class="label">Treasury Balance</div>
                <div class="value">${isActive ? balance + " Ⓝ" : "—"}</div>
              </div>
              <div class="stat">
                <div class="label">Status</div>
                <div class="value">${isActive ? "Live" : "Pending"}</div>
              </div>
            </div>
            <div class="badge ${isActive ? "badge-live" : "badge-pending"}">
              ${isActive ? "● Active" : "○ Pending Activation"}
            </div>
            <button class="btn btn-green activate-btn" ${isActive ? "disabled" : ""}>
              ${isActive ? "Activated ✓" : "Activate Business"}
            </button>
            <button class="btn btn-outline grant-btn" ${!isActive ? "disabled" : ""}>
              Grant Agent Access (Function-Call Key)
            </button>
            <div class="status-msg"></div>
            <div class="key-box"></div>
          `;
          listEl.appendChild(card);
        }

        document.querySelectorAll(".activate-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const card = btn.closest(".business-card");
            const tokenIdText = card.querySelector(".token-id")?.textContent || "";
            const tokenId = tokenIdText.replace("Token ID:", "").trim();
            activateBusiness(tokenId, btn);
          });
        });

        document.querySelectorAll(".grant-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const card = btn.closest(".business-card");
            const tokenIdText = card.querySelector(".token-id")?.textContent || "";
            const tokenId = tokenIdText.replace("Token ID:", "").trim();
            grantAgentAccess(tokenId, btn);
          });
        });

      } catch (err) {
        listEl.innerHTML = `<div style="color:#f87171;padding:20px 0;text-align:center;">Failed to load businesses</div>`;
        showToast("Failed to load businesses", "error");
      }
    }

    async function activateBusiness(tokenId, btn) {
      const card = btn.closest(".business-card");
      const statusEl = card ? card.querySelector(".status-msg") : null;
      const keyBox = card ? card.querySelector(".key-box") : null;
      const businessAccount = "business-" + tokenId + "." + CONTRACT_ID;

      try {
        btn.disabled = true;
        btn.innerText = "Confirm in wallet...";
        if (statusEl) {
          statusEl.className = "status-msg info";
          statusEl.innerText = "Creating treasury + Full Access key... Confirm in your wallet";
        }

        // Generate a Full Access key that will control the business account
        const { privateKeyStr, publicKeyStr } = generateKeyPair();

        // Show it immediately so the user can save it
        if (keyBox) {
          keyBox.className = "key-box show";
          keyBox.innerHTML = `
            <div style="color:#4ade80;margin-bottom:6px;font-weight:600;">🔑 Business Full Access Key (SAVE THIS)</div>
            <div style="user-select:all;word-break:break-all;">${privateKeyStr}</div>
            <div class="warning">
              ⚠️ This is the master key of the business account.<br>
              Save it now. You will need it to control the business later.
            </div>
          `;
        }

        const wallet = await connector.wallet();
        await wallet.signAndSendTransaction({
          receiverId: businessAccount,
          actions: [
            { type: "CreateAccount" },
            {
              type: "AddKey",
              params: {
                publicKey: publicKeyStr,
                accessKey: {
                  nonce: 0,
                  permission: "FullAccess"
                }
              }
            },
            { type: "Transfer", params: { deposit: "100000000000000000000000" } }
          ]
        });

        if (statusEl) {
          statusEl.className = "status-msg success";
          statusEl.innerText = "✅ Business activated! Full Access key has been added.";
        }
        btn.innerText = "Activated ✓";
        showToast("Business activated successfully", "success");
        setTimeout(() => loadBusinesses(), 2500);
      } catch (err) {
        if (statusEl) {
          statusEl.className = "status-msg error";
          statusEl.innerText = err.message || "Activation failed or cancelled";
        }
        showToast(err.message || "Activation failed", "error");
        btn.disabled = false;
        btn.innerText = "Activate Business";
      }
    }

    async function grantAgentAccess(tokenId, btn) {
      const realBusinessAccount = "business-" + tokenId + "." + CONTRACT_ID;

      const card = btn.closest(".business-card");
      if (!card) {
        showToast("Card not found. Please refresh.", "error");
        return;
      }
      const statusEl = card.querySelector(".status-msg");
      const keyBox = card.querySelector(".key-box");

      try {
        btn.disabled = true;
        btn.innerText = "Generating key...";
        if (statusEl) {
          statusEl.className = "status-msg info";
          statusEl.innerText = "Generating Function-Call key...";
        }

        const { privateKeyStr, publicKeyStr } = generateKeyPair();

        if (keyBox) {
          keyBox.className = "key-box show";
          keyBox.innerHTML = `
            <div style="color:#4ade80;margin-bottom:6px;font-weight:600;">🔑 Agent Private Key (COPY THIS NOW)</div>
            <div style="user-select:all;word-break:break-all;">${privateKeyStr}</div>
            <div class="warning">
              ⚠️ Copy this private key right now and store it safely.<br>
              This is the only time it will be shown.<br>
              You will later give this key to your AI agent.
            </div>
          `;
        }

        if (statusEl) {
          statusEl.innerText = "Key generated! Now confirm the transaction in your wallet...";
        }
        btn.innerText = "Confirm in wallet...";
        showToast("Key generated – confirm in wallet", "info");

        const wallet = await connector.wallet();

        await wallet.signAndSendTransaction({
          receiverId: realBusinessAccount,
          actions: [
            {
              type: "AddKey",
              params: {
                publicKey: publicKeyStr,
                accessKey: {
                  nonce: 0,
                  permission: {
                    receiverId: realBusinessAccount,
                    methodNames: [],
                    allowance: "250000000000000000000000"
                  }
                }
              }
            }
          ]
        });

        if (statusEl) {
          statusEl.className = "status-msg success";
          statusEl.innerText = "✅ Agent key granted successfully! Make sure you copied the private key above.";
        }
        btn.innerText = "Agent Key Granted ✓";
        btn.disabled = true;
        showToast("Agent key granted successfully!", "success");

      } catch (err) {
        if (statusEl) {
          statusEl.className = "status-msg error";
          statusEl.innerText = err.message || "Failed to grant key";
        }
        showToast(err.message || "Failed to grant key", "error");
        btn.disabled = false;
        btn.innerText = "Grant Agent Access (Function-Call Key)";
      }
    }

    init();
  </script>
</body>
</html>
