<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Autonomous Business NFT | NEAR</title>
  <script src="https://cdn.jsdelivr.net/npm/@near-wallet-selector/modal-ui@8.9.3/dist/modal-ui.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@near-wallet-selector/modal-ui@8.9.3/dist/styles.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #050508;
      color: #e4e4e7;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 16px 80px;
    }
    /* Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .live-badge {
      background: #14532d;
      color: #4ade80;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
    }
    /* Hero */
    .hero {
      text-align: center;
      padding: 20px 0 30px;
    }
    .hero h1 {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .hero h1 span {
      background: linear-gradient(90deg, #4ade80, #22c55e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      color: #a1a1aa;
      font-size: 0.95rem;
      max-width: 320px;
      margin: 0 auto 24px;
    }
    /* Card */
    .card {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 20px;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #a1a1aa;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 13px 14px;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #22c55e;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 12px 14px;
      background: #18181b;
      border-radius: 12px;
    }
    .price-label { color: #a1a1aa; font-size: 0.85rem; }
    .price-value { color: #4ade80; font-weight: 700; font-size: 1.1rem; }
    button.primary {
      width: 100%;
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.secondary {
      width: 100%;
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      border-radius: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      display: none;
    }
    .status.success { background: #14532d; color: #bbf7d0; display: block; }
    .status.error { background: #450a0a; color: #fecaca; display: block; }
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.8rem;
      color: #52525b;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="logo">
        <div class="logo-icon">◈</div>
        <span>Autonomous Business</span>
      </div>
      <div class="live-badge">
        <div class="live-dot"></div>
        Live on NEAR
      </div>
    </div>

    <!-- Hero -->
    <div class="hero">
      <h1>Mint Your Own<br><span>Autonomous Business</span></h1>
      <p>Own a living AI agent that earns for you on NEAR</p>
    </div>

    <!-- Connect Button -->
    <button class="secondary" id="connectBtn" onclick="handleConnect()">
      Connect Wallet
    </button>

    <!-- Mint Card -->
    <div class="card">
      <h2>Mint Autonomous Business NFT</h2>

      <div class="price-row">
        <span class="price-label">Price</span>
        <span class="price-value">0.01 Testnet NEAR</span>
      </div>

      <label>Business Name</label>
      <input type="text" id="title" placeholder="e.g. AI Strategy Co." value="My First Autonomous Business" />

      <label>Description</label>
      <textarea id="description" rows="3">This NFT owns a live autonomous business on NEAR</textarea>

      <button class="primary" id="mintBtn" onclick="mintNFT()" disabled>
        Mint Now
      </button>

      <div id="status" class="status"></div>
    </div>

    <div class="footer">
      Contract: buildingfromthetop.testnet<br>
      Network: Testnet • Built for NEAR Hackathon
    </div>
  </div>

  <script type="module">
    import { setupWalletSelector } from "https://cdn.jsdelivr.net/npm/@near-wallet-selector/core@8.9.3/+esm";
    import { setupModal } from "https://cdn.jsdelivr.net/npm/@near-wallet-selector/modal-ui@8.9.3/+esm";
    import { setupMeteorWallet } from "https://cdn.jsdelivr.net/npm/@near-wallet-selector/meteor-wallet@8.9.3/+esm";
    import { setupHereWallet } from "https://cdn.jsdelivr.net/npm/@near-wallet-selector/here-wallet@8.9.3/+esm";
    import { setupMyNearWallet } from "https://cdn.jsdelivr.net/npm/@near-wallet-selector/my-near-wallet@8.9.3/+esm";

    const CONTRACT_ID = "buildingfromthetop.testnet";
    let selector = null;
    let modal = null;
    let accountId = null;

    async function init() {
      selector = await setupWalletSelector({
        network: "testnet",
        modules: [
          setupMeteorWallet(),
          setupHereWallet(),
          setupMyNearWallet(),
        ],
      });

      modal = setupModal(selector, {
        contractId: CONTRACT_ID,
        methodNames: ["nft_mint"],
      });

      const state = selector.store.getState();
      if (state.accounts.length > 0) {
        accountId = state.accounts[0].accountId;
        updateUI();
      }

      selector.on("signedIn", () => {
        const state = selector.store.getState();
        accountId = state.accounts[0].accountId;
        updateUI();
      });

      selector.on("signedOut", () => {
        accountId = null;
        updateUI();
      });
    }

    function updateUI() {
      const btn = document.getElementById("connectBtn");
      const mintBtn = document.getElementById("mintBtn");
      if (accountId) {
        btn.innerText = accountId.length > 20 ? accountId.slice(0, 10) + "..." + accountId.slice(-6) : accountId;
        mintBtn.disabled = false;
      } else {
        btn.innerText = "Connect Wallet";
        mintBtn.disabled = true;
      }
    }

    window.handleConnect = () => {
      if (accountId) {
        // already connected - maybe show disconnect later
        return;
      }
      modal.show();
    };

    window.mintNFT = async () => {
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const statusEl = document.getElementById("status");

      if (!title || !description) {
        statusEl.className = "status error";
        statusEl.innerText = "Please fill title and description";
        return;
      }

      try {
        statusEl.className = "status";
        statusEl.style.display = "block";
        statusEl.innerText = "Confirm the transaction in your wallet...";

        const wallet = await selector.wallet();
        await wallet.signAndSendTransaction({
          receiverId: CONTRACT_ID,
          actions: [{
            type: "FunctionCall",
            params: {
              methodName: "nft_mint",
              args: {
                receiver_id: accountId,
                title,
                description
              },
              gas: "30000000000000",
              deposit: "10000000000000000000000" // 0.01 NEAR
            }
          }]
        });

        statusEl.className = "status success";
        statusEl.innerText = "✅ NFT Minted Successfully!";
      } catch (err) {
        console.error(err);
        statusEl.className = "status error";
        statusEl.innerText = err.message || "Transaction failed or cancelled";
      }
    };

    init();
  </script>
</body>
</html>
