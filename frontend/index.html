<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Autonomous Business NFT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #050508;
      color: #f4f4f5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 16px 80px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
    }
    .logo-box {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }
    .live {
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
    }
    .hero {
      text-align: center;
      padding: 10px 0 28px;
    }
    .hero h1 {
      font-size: 2.35rem;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }
    .hero h1 span {
      background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      color: #a1a1aa;
      font-size: 1rem;
      max-width: 300px;
      margin: 0 auto;
    }
    .card {
      background: #0f0f12;
      border: 1px solid #27272a;
      border-radius: 22px;
      padding: 24px 20px;
      margin-bottom: 18px;
    }
    .card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .price-box {
      background: #18181b;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .price-label { color: #a1a1aa; font-size: 0.9rem; }
    .price-value { color: #4ade80; font-weight: 700; font-size: 1.15rem; }
    label {
      display: block;
      font-size: 0.8rem;
      color: #a1a1aa;
      margin-bottom: 7px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 13px;
      padding: 14px 15px;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #22c55e;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: white;
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      margin-bottom: 14px;
    }
    .status {
      margin-top: 16px;
      padding: 13px 15px;
      border-radius: 13px;
      font-size: 0.9rem;
      display: none;
    }
    .status.success {
      background: #14532d;
      color: #bbf7d0;
      display: block;
    }
    .status.error {
      background: #450a0a;
      color: #fecaca;
      display: block;
    }
    .footer {
      text-align: center;
      margin-top: 36px;
      font-size: 0.8rem;
      color: #52525b;
      line-height: 1.6;
    }

    /* Custom Wallet Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 9999;
      padding: 16px;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: #111114;
      border: 1px solid #27272a;
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 440px;
      padding: 24px 20px 40px;
    }
    .modal h3 {
      font-size: 1.2rem;
      margin-bottom: 6px;
      text-align: center;
    }
    .modal p {
      text-align: center;
      color: #a1a1aa;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    .wallet-option {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .wallet-option:active {
      border-color: #22c55e;
    }
    .wallet-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #27272a;
      display: grid;
      place-items: center;
      font-size: 20px;
    }
    .wallet-name {
      font-weight: 600;
      font-size: 1.05rem;
    }
    .wallet-desc {
      font-size: 0.8rem;
      color: #a1a1aa;
    }
    .close-btn {
      margin-top: 16px;
      background: transparent;
      border: 1px solid #3f3f46;
      color: #a1a1aa;
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

    <div class="topbar">
      <div class="logo">
        <div class="logo-box">◈</div>
        <span>Autonomous Business</span>
      </div>
      <div class="live">Live on NEAR</div>
    </div>

    <div class="hero">
      <h1>Mint Your Own<br><span>Autonomous Business</span></h1>
      <p>Own a living AI agent that earns for you on NEAR</p>
    </div>

    <button class="btn btn-secondary" id="connectBtn" onclick="openWalletModal()">
      Connect Wallet
    </button>

      <h2>Mint Autonomous Business NFT</h2>

      <div class="price-box">
        <span class="price-label">Price</span>
        <span class="price-value">0.01 Testnet NEAR</span>
      </div>

      <label>Business Name</label>
      <input type="text" id="title" value="My First Autonomous Business" />
