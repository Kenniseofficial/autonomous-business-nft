<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Autonomous Business NFT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #050508;
      color: #f4f4f5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 16px 100px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
    }
    .logo-box {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }
    .live {
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 10px 0 28px;
    }
    .hero h1 {
      font-size: 2.35rem;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }
    .hero h1 span {
      background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      color: #a1a1aa;
      font-size: 1rem;
      max-width: 300px;
      margin: 0 auto;
    }

    /* Card */
    .card {
      background: #0f0f12;
      border: 1px solid #27272a;
      border-radius: 22px;
      padding: 24px 20px;
      margin-bottom: 18px;
    }
    .card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .price-box {
      background: #18181b;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .price-label { color: #a1a1aa; font-size: 0.9rem; }
    .price-value { color: #4ade80; font-weight: 700; font-size: 1.15rem; }

    label {
      display: block;
      font-size: 0.8rem;
      color: #a1a1aa;
      margin-bottom: 7px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 13px;
      padding: 14px 15px;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #22c55e;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary {
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: white;
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      margin-bottom: 14px;
    }

    .status {
      margin-top: 16px;
      padding: 13px 15px;
      border-radius: 13px;
      font-size: 0.9rem;
      display: none;
    }
    .status.success {
      background: #14532d;
      color: #bbf7d0;
      display: block;
    }
    .status.error {
      background: #450a0a;
      color: #fecaca;
      display: block;
    }

    .footer {
      text-align: center;
      margin-top: 36px;
      font-size: 0.8rem;
      color: #52525b;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="logo">
        <div class="logo-box">◈</div>
        <span>Autonomous Business</span>
      </div>
      <div class="live">Live on NEAR</div>
    </div>

    <!-- Hero -->
    <div class="hero">
      <h1>Mint Your Own<br><span>Autonomous Business</span></h1>
      <p>Own a living AI agent that earns for you on NEAR</p>
    </div>

    <!-- Connect -->
    <button class="btn btn-secondary" id="connectBtn" onclick="connectWallet()">
      Connect Wallet
    </button>

    <!-- Mint Card -->
    <div class="card">
      <h2>Mint Autonomous Business NFT</h2>

      <div class="price-box">
        <span class="price-label">Price</span>
        <span class="price-value">0.01 Testnet NEAR</span>
      </div>

      <label>Business Name</label>
      <input type="text" id="title" value="My First Autonomous Business" placeholder="e.g. AI Strategy Co." />

      <label>Description</label>
      <textarea id="description" rows="3">This NFT owns a live autonomous business on NEAR</textarea>

      <button class="btn btn-primary" id="mintBtn" onclick="mintNFT()" disabled>
        Mint Now
      </button>

      <div id="status" class="status"></div>
    </div>

    <div class="footer">
      Contract: buildingfromthetop.testnet<br>
      Network: Testnet • Built for NEAR Hackathon
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/near-api-js@4.0.3/dist/near-api-js.min.js"></script>
  <script>
    const CONTRACT_ID = "buildingfromthetop.testnet";
    let walletConnection = null;
    let accountId = null;

    async function initNear() {
      const near = await nearApi.connect({
        networkId: "testnet",
        keyStore: new nearApi.keyStores.BrowserLocalStorageKeyStore(),
        nodeUrl: "https://rpc.testnet.near.org",
        walletUrl: "https://testnet.mynearwallet.com",
        helperUrl: "https://helper.testnet.near.org",
      });

      walletConnection = new nearApi.WalletConnection(near, "autonomous-business-nft");

      if (walletConnection.isSignedIn()) {
        accountId = walletConnection.getAccountId();
        updateUI();
      }
    }

    function updateUI() {
      const btn = document.getElementById("connectBtn");
      const mintBtn = document.getElementById("mintBtn");

      if (accountId) {
        const short = accountId.length > 18 
          ? accountId.slice(0, 8) + "..." + accountId.slice(-6) 
          : accountId;
        btn.innerText = short;
        mintBtn.disabled = false;
      } else {
        btn.innerText = "Connect Wallet";
        mintBtn.disabled = true;
      }
    }

    function connectWallet() {
      if (accountId) return;

      // Redirect to Meteor Wallet (recommended)
      // Meteor supports deep linking better on mobile
      const currentUrl = window.location.href;
      const meteorUrl = `https://wallet.meteorwallet.app/connect?contract_id=\( {CONTRACT_ID}&success_url= \){encodeURIComponent(currentUrl)}&failure_url=${encodeURIComponent(currentUrl)}`;
      
      // Fallback: use classic MyNearWallet style for now
      walletConnection.requestSignIn({
        contractId: CONTRACT_ID,
        methodNames: ["nft_mint"],
      });
    }

    async function mintNFT() {
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const statusEl = document.getElementById("status");

      if (!title || !description) {
        statusEl.className = "status error";
        statusEl.innerText = "Please fill in Business Name and Description";
        return;
      }

      try {
        statusEl.className = "status";
        statusEl.style.display = "block";
        statusEl.innerText = "Confirm transaction in your wallet...";

        await walletConnection.account().functionCall({
          contractId: CONTRACT_ID,
          methodName: "nft_mint",
          args: {
            receiver_id: accountId,
            title: title,
            description: description
          },
          gas: "30000000000000",
          attachedDeposit: "10000000000000000000000" // 0.01 NEAR
        });

        statusEl.className = "status success";
        statusEl.innerText = "✅ NFT Minted Successfully!";
      } catch (err) {
        console.error(err);
        statusEl.className = "status error";
        statusEl.innerText = err.message || "Transaction failed or cancelled";
      }
    }

    // Start
    initNear();
  </script>
</body>
</html>
