<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Autonomous Business NFT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #050508;
      color: #f4f4f5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 16px 80px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 24px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
    }
    .logo-box {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }
    .live {
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
    }
    .card {
      background: #121216;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 6px;
    }
    .card p {
      color: #a1a1aa;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #a1a1aa;
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      background: #0a0a0c;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 14px 16px;
      color: #f4f4f5;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0a0a0c;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .price-row span:last-child {
      color: #4ade80;
      font-weight: 600;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
    }
    .btn-danger {
      background: transparent;
      border: 1px solid #ef4444;
      color: #f87171;
      margin-top: 12px;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      margin-top: 12px;
    }
    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      display: none;
    }
    .status.success {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      display: block;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      display: block;
    }
    .hidden { display: none !important; }
    .dashboard-item {
      background: #0a0a0c;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .dashboard-item h3 {
      font-size: 1rem;
      margin-bottom: 4px;
    }
    .dashboard-item p {
      font-size: 0.8rem;
      color: #a1a1aa;
      margin: 0;
    }
    .footer {
      text-align: center;
      color: #52525b;
      font-size: 0.75rem;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">
        <div class="logo-box">🚀</div>
        <span>Business NFT</span>
      </div>
      <div class="live">Testnet Live</div>
    </div>

    <button id="connectBtn" class="btn-primary">Connect Wallet</button>
    <button id="disconnectBtn" class="btn-danger hidden">Disconnect Wallet</button>

    <div class="card" style="margin-top:20px;">
      <h2>Mint Autonomous Business NFT</h2>
      <p>Own an NFT that runs its own business on NEAR.</p>

      <div class="price-row">
        <span>Price</span>
        <span>0.01 Testnet NEAR</span>
      </div>

      <label>Business Name</label>
      <input id="title" type="text" value="My First Autonomous Business" />

      <label>Description</label>
      <textarea id="description">This NFT owns a live autonomous business on NEAR</textarea>

      <button id="mintBtn" class="btn-primary">Mint Now</button>
      <div id="status" class="status"></div>
    </div>

    <!-- Owner Dashboard -->
    <div id="dashboardCard" class="card hidden">
      <h2>Your Businesses</h2>
      <p>NFTs you currently own</p>
      <div id="dashboardList"></div>
      <button id="refreshBtn" class="btn-outline">Refresh Dashboard</button>
    </div>

    <div class="footer">
      Contract: buildingfromthetop.testnet<br>
      Network: Testnet • Built for NEAR Hackathon
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "@hot-labs/near-connect": "https://esm.sh/@hot-labs/near-connect@0.0.12"
    }
  }
  </script>

  <script type="module">
    import { NearConnector } from "@hot-labs/near-connect";

    const CONTRACT_ID = "buildingfromthetop.testnet";
    let accountId = null;
    let connector = null;

    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const mintBtn = document.getElementById("mintBtn");
    const statusEl = document.getElementById("status");
    const dashboardCard = document.getElementById("dashboardCard");
    const dashboardList = document.getElementById("dashboardList");
    const refreshBtn = document.getElementById("refreshBtn");

    async function init() {
      connector = new NearConnector({ network: "testnet" });

      connector.on("wallet:signIn", (event) => {
        accountId = event.accounts[0].accountId;
        updateUI();
        loadDashboard();
      });

      connector.on("wallet:signOut", () => {
        accountId = null;
        updateUI();
      });
    }

    function updateUI() {
      if (accountId) {
        connectBtn.classList.add("hidden");
        disconnectBtn.classList.remove("hidden");
        dashboardCard.classList.remove("hidden");
      } else {
        connectBtn.classList.remove("hidden");
        disconnectBtn.classList.add("hidden");
        dashboardCard.classList.add("hidden");
      }
    }

    connectBtn.addEventListener("click", async () => {
      try {
        await connector.connect();
      } catch (err) {
        console.error(err);
      }
    });

    disconnectBtn.addEventListener("click", async () => {
      try {
        await connector.disconnect();
        accountId = null;
        updateUI();
      } catch (err) {
        console.error(err);
      }
    });

    mintBtn.addEventListener("click", async () => {
      if (!accountId) {
        statusEl.className = "status error";
        statusEl.style.display = "block";
        statusEl.innerText = "Please connect your wallet first";
        return;
      }

      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();

      if (!title || !description) {
        statusEl.className = "status error";
        statusEl.style.display = "block";
        statusEl.innerText = "Please fill Business Name and Description";
        return;
      }

      try {
        statusEl.className = "status";
        statusEl.style.display = "block";
        statusEl.innerText = "Confirm the transaction in your wallet...";

        const wallet = await connector.wallet();

        await wallet.signAndSendTransaction({
          receiverId: CONTRACT_ID,
          actions: [{
            type: "FunctionCall",
            params: {
              methodName: "nft_mint",
              args: {
                receiver_id: accountId,
                title: title,
                description: description
              },
              gas: "30000000000000",
              deposit: "10000000000000000000000"
            }
          }]
        });

        statusEl.className = "status success";
        statusEl.innerText = "✅ NFT Minted Successfully! Your Autonomous Business is live.";
        setTimeout(loadDashboard, 2500);
      } catch (err) {
        console.error(err);
        statusEl.className = "status error";
        statusEl.style.display = "block";
        statusEl.innerText = err.message || "Transaction failed or cancelled";
      }
    });

    async function loadDashboard() {
      if (!accountId) return;

      dashboardList.innerHTML = "<p style='color:#a1a1aa;font-size:0.9rem;'>Loading your businesses...</p>";

      try {
        const res = await fetch("https://rpc.testnet.near.org", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0",
            id: "1",
            method: "query",
            params: {
              request_type: "call_function",
              finality: "final",
              account_id: CONTRACT_ID,
              method_name: "nft_tokens_for_owner",
              args_base64: btoa(JSON.stringify({ account_id: accountId }))
            }
          })
        });

        const data = await res.json();
        const bytes = data.result?.result;

        if (!bytes) {
          dashboardList.innerHTML = "<p style='color:#a1a1aa;'>No businesses yet. Mint one above.</p>";
          return;
        }

        const tokens = JSON.parse(String.fromCharCode(...bytes));

        if (!tokens || tokens.length === 0) {
          dashboardList.innerHTML = "<p style='color:#a1a1aa;'>No businesses yet. Mint one above.</p>";
          return;
        }

        dashboardList.innerHTML = "";
        tokens.forEach(token => {
          const div = document.createElement("div");
          div.className = "dashboard-item";
          div.innerHTML = `
            <h3>${token.metadata?.title || "Untitled Business"}</h3>
            <p>${token.metadata?.description || ""}</p>
            <p style="margin-top:8px; color:#4ade80;">Token ID: ${token.token_id}</p>
          `;
          dashboardList.appendChild(div);
        });
      } catch (err) {
        console.error(err);
        dashboardList.innerHTML = "<p style='color:#f87171;'>Failed to load dashboard</p>";
      }
    }

    refreshBtn.addEventListener("click", loadDashboard);

    init();
  </script>
</body>
</html>
