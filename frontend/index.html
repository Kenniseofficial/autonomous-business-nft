<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Autonomous Business NFT</title>
  <script src="https://cdn.jsdelivr.net/npm/near-api-js@0.44.2/dist/near-api-js.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f13;
      color: #e5e5e5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }
    header {
      text-align: center;
      padding: 30px 0 20px;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      color: #a1a1aa;
      margin-top: 8px;
      font-size: 0.95rem;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      color: #f4f4f5;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #a1a1aa;
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 16px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #22c55e;
    }
    button {
      width: 100%;
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button:active {
      opacity: 0.85;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: none;
    }
    .status.success {
      background: #14532d;
      color: #bbf7d0;
      display: block;
    }
    .status.error {
      background: #450a0a;
      color: #fecaca;
      display: block;
    }
    .wallet-btn {
      background: #27272a;
      border: 1px solid #3f3f46;
      margin-bottom: 20px;
    }
    .info {
      font-size: 0.85rem;
      color: #71717a;
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Autonomous Business NFT</h1>
      <p>Mint an NFT that runs its own business on NEAR</p>
    </header>

    <button class="wallet-btn" id="connectBtn" onclick="connectWallet()">
      Connect Wallet
    </button>

    <div class="card">
      <h2>Mint Your Autonomous Business</h2>
      
      <label>Title</label>
      <input type="text" id="title" placeholder="My AI Research Agency" value="My First Autonomous Business" />

      <label>Description</label>
      <textarea id="description" rows="3" placeholder="What will this business do?">This NFT owns a live autonomous business on NEAR</textarea>

      <button id="mintBtn" onclick="mintNFT()" disabled>Mint NFT (0.01 NEAR)</button>

      <div id="status" class="status"></div>
    </div>

    <div class="info">
      Contract: buildingfromthetop.testnet<br>
      Network: Testnet
    </div>
  </div>

  <script>
    const CONTRACT_ID = "buildingfromthetop.testnet";
    let walletConnection = null;
    let accountId = null;

    async function connectWallet() {
      const near = await nearApi.connect({
        networkId: "testnet",
        keyStore: new nearApi.keyStores.BrowserLocalStorageKeyStore(),
        nodeUrl: "https://rpc.testnet.near.org",
        walletUrl: "https://testnet.mynearwallet.com",
        helperUrl: "https://helper.testnet.near.org",
      });

      walletConnection = new nearApi.WalletConnection(near, "autonomous-business-nft");

      if (walletConnection.isSignedIn()) {
        accountId = walletConnection.getAccountId();
        document.getElementById("connectBtn").innerText = "Connected: " + accountId;
        document.getElementById("mintBtn").disabled = false;
      } else {
        walletConnection.requestSignIn({
          contractId: CONTRACT_ID,
          methodNames: ["nft_mint"],
        });
      }
    }

    async function mintNFT() {
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const statusEl = document.getElementById("status");

      if (!title || !description) {
        statusEl.className = "status error";
        statusEl.innerText = "Please fill in title and description";
        return;
      }

      try {
        statusEl.className = "status";
        statusEl.style.display = "block";
        statusEl.innerText = "Minting... Please confirm in your wallet";

        const account = walletConnection.account();

        await account.functionCall({
          contractId: CONTRACT_ID,
          methodName: "nft_mint",
          args: {
            receiver_id: accountId,
            title: title,
            description: description
          },
          gas: "30000000000000",
          attachedDeposit: "10000000000000000000000" // 0.01 NEAR
        });

        statusEl.className = "status success";
        statusEl.innerText = "✅ NFT Minted Successfully! Refresh or check your wallet.";
      } catch (err) {
        console.error(err);
        statusEl.className = "status error";
        statusEl.innerText = "Error: " + (err.message || "Transaction failed");
      }
    }

    // Auto-connect if already signed in
    window.onload = () => {
      connectWallet();
    };
  </script>
</body>
</html>
