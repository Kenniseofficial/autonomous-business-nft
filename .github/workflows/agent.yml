name: Agent worker

permissions:
  contents: write

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: agent-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --prefix agent

      - name: Run the agent
        run: node agent/agent.mjs
        env:
          BUSINESS_ACCOUNT: ${{ secrets.BUSINESS_ACCOUNT }}
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY }}

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest changes and push updates
        run: |
          git pull origin main --rebase
          git push origin main
