name: Build TypeScript Business NFT

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/business-nft-ts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd contracts/business-nft-ts
          npm install

      - name: Build contract
        run: |
          cd contracts/business-nft-ts
          npm run build

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: business-nft-ts-wasm
          path: contracts/business-nft-ts/build/business_nft.wasm
